<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostline Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/*FONTFACE-START*/
@font-face{font-family:"Yetson Sans";src:url("fonts/YetsonSans-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Yetson Sans";src:url("fonts/YetsonSans-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Yetson Sans";src:url("fonts/YetsonSans-SemiBold.otf") format("opentype");font-weight:600 700;font-style:normal;font-display:swap}
/*FONTFACE-END*/

/* Hostline theme on top of Bootstrap 5.3. Single light theme by design. */
:root{
  color-scheme:light;
  --hl-blue:#025CFD; --hl-blue-600:#004FDB; --hl-blue-700:#0043BA; --hl-blue-50:#EEF4FF; --hl-blue-100:#DCE7FF; --hl-blue-200:#B9CFFF;
  --hl-ink:#0F172A; --hl-ink-2:#344054; --hl-muted:#64748B; --hl-line:#E5E8EF; --hl-line-2:#D0D5DD; --hl-bg:#F5F7FB; --hl-surface:#FFFFFF;
  --bs-primary:#025CFD; --bs-primary-rgb:2,92,253;
  --bs-primary-bg-subtle:#EEF4FF; --bs-primary-border-subtle:#B9CFFF; --bs-primary-text-emphasis:#0043BA;
  --bs-link-color:#025CFD; --bs-link-color-rgb:2,92,253; --bs-link-hover-color:#0043BA; --bs-link-hover-color-rgb:0,67,186;
  --bs-focus-ring-color:rgba(2,92,253,.25);
  --bs-body-font-family:"Yetson Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bs-body-font-size:.9375rem; --bs-body-line-height:1.5;
  --bs-body-color:#0F172A; --bs-body-color-rgb:15,23,42; --bs-body-bg:#F5F7FB;
  --bs-secondary-color:#64748B; --bs-secondary-color-rgb:100,116,139;
  --bs-border-color:#E5E8EF; --bs-border-radius:.625rem; --bs-border-radius-sm:.5rem; --bs-border-radius-lg:.875rem; --bs-border-radius-xl:1.125rem;
  --bs-success:#12A150; --bs-success-rgb:18,161,80; --bs-danger:#E5382D; --bs-danger-rgb:229,56,45; --bs-warning:#F59E0B; --bs-warning-rgb:245,158,11;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05); --shadow-sm:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04); --shadow-lg:0 20px 40px -12px rgba(16,24,40,.22);
}
body{background:var(--hl-bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,h5,h6,.h1,.h2,.h3,.h4,.h5,.h6{font-weight:600;letter-spacing:-.01em;color:var(--hl-ink);text-wrap:balance}
h1,.h1{font-size:1.625rem}
.fw-medium{font-weight:500!important}
.fw-semibold{font-weight:600!important}
.tnum{font-variant-numeric:tabular-nums}
.small,small{font-size:.8125rem}
.xsmall{font-size:.75rem}
.text-secondary{color:var(--hl-muted)!important}
.ic{width:18px;height:18px;stroke-width:1.9;flex:none;vertical-align:-3px}
.ic-xs{width:14px;height:14px;vertical-align:-2px}
.ic-lg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--hl-blue);outline-offset:2px}

/* buttons */
.btn{--bs-btn-font-weight:500;--bs-btn-padding-y:.5rem;--bs-btn-padding-x:.9rem;--bs-btn-font-size:.875rem;--bs-btn-border-radius:.625rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap}
.btn-sm{--bs-btn-padding-y:.3rem;--bs-btn-padding-x:.65rem;--bs-btn-font-size:.8125rem;--bs-btn-border-radius:.5rem}
.btn-primary{--bs-btn-bg:#025CFD;--bs-btn-border-color:#025CFD;--bs-btn-hover-bg:#004FDB;--bs-btn-hover-border-color:#004FDB;--bs-btn-active-bg:#0043BA;--bs-btn-active-border-color:#0043BA;--bs-btn-disabled-bg:#025CFD;--bs-btn-disabled-border-color:#025CFD;--bs-btn-focus-shadow-rgb:2,92,253;box-shadow:var(--shadow-xs)}
.btn-white{--bs-btn-bg:#fff;--bs-btn-color:#344054;--bs-btn-border-color:#D0D5DD;--bs-btn-hover-bg:#F9FAFB;--bs-btn-hover-color:#0F172A;--bs-btn-hover-border-color:#C0C6D0;--bs-btn-active-bg:#F2F4F7;--bs-btn-active-border-color:#C0C6D0;--bs-btn-disabled-bg:#fff;--bs-btn-disabled-border-color:#E4E7EC;box-shadow:var(--shadow-xs)}
.btn-soft{--bs-btn-bg:#EEF4FF;--bs-btn-color:#0043BA;--bs-btn-border-color:transparent;--bs-btn-hover-bg:#DCE7FF;--bs-btn-hover-color:#0043BA;--bs-btn-active-bg:#C9DAFF}
.btn-outline-danger{--bs-btn-color:#D92D20;--bs-btn-border-color:#FDA29B;--bs-btn-hover-bg:#FEF3F2;--bs-btn-hover-color:#B42318;--bs-btn-hover-border-color:#F97066;--bs-btn-active-bg:#FEE4E2;--bs-btn-active-color:#B42318}
.btn-danger{--bs-btn-bg:#D92D20;--bs-btn-border-color:#D92D20;--bs-btn-hover-bg:#B42318;--bs-btn-hover-border-color:#B42318}
.btn-link{--bs-btn-color:#025CFD;--bs-btn-hover-color:#0043BA;text-decoration:none;padding-inline:.25rem}
.btn-icon{width:38px;height:38px;padding:0;border-radius:50%}
.btn:disabled,.btn.disabled{opacity:.5}

/* forms */
.form-control,.form-select{border-color:var(--hl-line-2);border-radius:.625rem;padding:.55rem .8rem;font-size:.9rem;box-shadow:var(--shadow-xs)}
.form-control:focus,.form-select:focus{border-color:#7FADFE;box-shadow:0 0 0 .22rem rgba(2,92,253,.15)}
.form-control[readonly]{background:#F8FAFC;color:var(--hl-muted)}
.form-label{font-weight:500;font-size:.8125rem;color:var(--hl-ink-2);margin-bottom:.35rem}
.form-text{font-size:.75rem;color:var(--hl-muted)}
.form-check-input{border-color:#C3C9D4}
.form-check-input:checked{background-color:#025CFD;border-color:#025CFD}
.form-check-input:focus{border-color:#7FADFE;box-shadow:0 0 0 .22rem rgba(2,92,253,.15)}
.form-select-sm,.form-control-sm{padding:.3rem .6rem;font-size:.8125rem;border-radius:.5rem}
.form-select-sm{padding-right:2rem}
.invalid-text{color:#D92D20;font-size:.75rem}

/* surfaces */
.card{--bs-card-border-color:var(--hl-line);--bs-card-border-radius:.875rem;--bs-card-inner-border-radius:.8rem;--bs-card-cap-bg:#fff;--bs-card-spacer-y:1.15rem;--bs-card-spacer-x:1.25rem;box-shadow:var(--shadow-xs)}
.card-header{border-bottom-color:var(--hl-line);padding-block:.9rem}
.card-title{font-size:1rem;font-weight:600;margin:0}
.table{--bs-table-hover-bg:#F7F9FF;--bs-table-border-color:#EEF0F4;margin:0;font-size:.875rem}
.table>thead th{font-weight:500;color:var(--hl-muted);font-size:.78rem;background:#FAFBFC;padding-block:.65rem;white-space:nowrap;border-bottom-color:var(--hl-line)}
.table>:not(caption)>*>*{padding:.75rem 1rem}
.table tbody tr:last-child td{border-bottom:0}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table .worst{color:#D92D20;font-weight:600}
.table-click tbody tr{cursor:pointer}
.th-sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem}
.th-sort:focus-visible{outline:2px solid var(--hl-blue)}
.list-group{--bs-list-group-border-color:#EEF0F4;--bs-list-group-action-hover-bg:#F7F9FF;--bs-list-group-active-bg:#EEF4FF;--bs-list-group-active-color:#0F172A;--bs-list-group-active-border-color:#EEF0F4}
.list-group-item{padding:.85rem 1.1rem}
.list-group-item.active{box-shadow:inset 3px 0 0 #025CFD}
.list-group-item-action{cursor:pointer}

/* badges */
.badge{font-weight:500;font-size:.72rem;padding:.38em .7em;border-radius:999px;display:inline-flex;align-items:center;gap:.3rem;letter-spacing:.01em;white-space:nowrap}
.pill-secondary{background:#F1F3F7;color:#344054}
.pill-primary{background:#EEF4FF;color:#0043BA}
.pill-success{background:#E8F7EE;color:#0E7A3D}
.pill-warning{background:#FEF5E3;color:#935A07}
.pill-danger{background:#FEEFEE;color:#B42318}
.pill-dark{background:#0F172A;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:#CBD2DC}
.dot-danger{background:#E5382D}.dot-warning{background:#F59E0B}.dot-success{background:#12A150}.dot-primary{background:#025CFD}

/* tabs and segmented controls */
.nav-underline{--bs-nav-underline-gap:1.5rem;--bs-nav-underline-link-active-color:#025CFD;--bs-nav-link-color:#64748B;--bs-nav-link-hover-color:#0F172A;--bs-nav-link-font-size:.9rem;border-bottom:1px solid var(--hl-line);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.nav-underline .nav-link{padding-block:.7rem;font-weight:500;white-space:nowrap}
.nav-underline .nav-link.active{font-weight:600}
.nav-underline .count{font-size:.72rem;background:#F1F3F7;color:#475467;border-radius:999px;padding:.05rem .45rem;margin-left:.35rem}
.nav-underline .nav-link.active .count{background:#EEF4FF;color:#0043BA}
.seg{display:inline-flex;background:#F1F3F7;border-radius:.625rem;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:.38rem .8rem;border-radius:.5rem;font-size:.8125rem;font-weight:500;color:#475467;white-space:nowrap}
.seg button.on{background:#fff;color:#0F172A;box-shadow:0 1px 2px rgba(16,24,40,.1)}
.seg button:focus-visible{outline:2px solid var(--hl-blue)}
.seg .count{color:#94A3B8;margin-left:.3rem}

/* prototype bar */
.proto{background:#0B1220;color:#CBD5E1;font-size:.78rem;padding:.45rem 1rem;display:flex;gap:.5rem 1.25rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.proto b{color:#fff;font-weight:600}
.proto .form-select{background-color:#162033;border-color:#2A3650;color:#E2E8F0;box-shadow:none;width:auto;font-size:.75rem;padding:.2rem 1.9rem .2rem .55rem;background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23CBD5E1' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e")}
.proto .form-check{margin:0;display:flex;align-items:center;gap:.4rem;min-height:0}
.proto .form-check-input{background-color:#2A3650;border-color:#3B4864;margin:0}
.proto .form-check-input:checked{background-color:#025CFD;border-color:#025CFD}
.proto .btn{--bs-btn-color:#E2E8F0;--bs-btn-border-color:#2A3650;--bs-btn-hover-bg:#162033;--bs-btn-hover-color:#fff;--bs-btn-hover-border-color:#3B4864;--bs-btn-padding-y:.15rem;--bs-btn-font-size:.75rem}

/* shell */
.shell{display:flex;min-height:calc(100vh - 38px)}
.sidebar{width:252px;flex:none;background:#fff;border-right:1px solid var(--hl-line);display:flex;flex-direction:column;padding:1.1rem .85rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem 1rem}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2A78FF,#025CFD 55%,#0043BA);display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px -2px rgba(2,92,253,.45)}
.brand-mark .ic{width:18px;height:18px;stroke-width:2.2}
.brand-name{font-weight:600;font-size:1.1rem;letter-spacing:-.01em}
.ws-card{border:1px solid var(--hl-line);border-radius:.75rem;padding:.6rem .75rem;margin:0 .15rem 1rem;display:flex;align-items:center;gap:.6rem;background:#FBFCFE}
.ws-logo{width:30px;height:30px;border-radius:8px;background:#0F172A;color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:600;flex:none}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav .nav-link{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;border-radius:.6rem;color:#475467;font-weight:500;font-size:.9rem}
.side-nav .nav-link:hover{background:#F5F7FB;color:#0F172A}
.side-nav .nav-link.active{background:#EEF4FF;color:#025CFD;font-weight:600}
.side-nav .nav-link .count{margin-left:auto;font-size:.72rem;background:#F1F3F7;color:#475467;border-radius:999px;padding:.05rem .5rem;font-weight:500}
.side-nav .nav-link.active .count{background:#fff;color:#025CFD}
.side-label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#94A3B8;font-weight:600;padding:1rem .7rem .4rem}
.side-foot{margin-top:auto;padding-top:1rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:1020;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--hl-line);padding:.7rem 1.75rem;display:flex;align-items:center;gap:.75rem}
.content{padding:1.75rem;max-width:1360px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:1.5rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.page-head p{color:var(--hl-muted);margin:.3rem 0 0}
.mobile-nav{display:none}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--hl-line-2);background:#fff;display:grid;place-items:center;color:#344054;box-shadow:var(--shadow-xs);cursor:pointer}
.icon-btn:hover{background:#F9FAFB}
.icon-btn .badge-dot{position:absolute;top:-3px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#E5382D;color:#fff;font-size:.68rem;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#DCE7FF,#B9CFFF);color:#0043BA;display:grid;place-items:center;font-weight:600;font-size:.8rem;flex:none}
.scope-btn{display:inline-flex;align-items:center;gap:.5rem}
.dropdown-menu{--bs-dropdown-border-color:var(--hl-line);--bs-dropdown-border-radius:.75rem;--bs-dropdown-link-active-bg:#EEF4FF;--bs-dropdown-link-active-color:#0043BA;--bs-dropdown-link-hover-bg:#F5F7FB;--bs-dropdown-item-padding-y:.45rem;--bs-dropdown-font-size:.875rem;box-shadow:var(--shadow-lg);padding:.4rem;max-height:70vh;overflow-y:auto}
.dropdown-item{border-radius:.5rem;display:flex;align-items:center;gap:.5rem}
.dropdown-header{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:#94A3B8}

/* KPI + tiles */
.kpi .kpi-value{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-alert{border-color:#FDA29B}
.kpi-alert .kpi-value{color:#D92D20}
.icon-tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#EEF4FF;color:#025CFD;flex:none}
.icon-tile-sm{width:30px;height:30px;border-radius:9px}
.icon-tile-sm .ic{width:16px;height:16px}
.icon-tile-lg{width:56px;height:56px;border-radius:16px}
.icon-tile-lg .ic{width:26px;height:26px}
.tone-success{background:#E8F7EE;color:#12A150}.tone-warning{background:#FEF5E3;color:#D97706}.tone-danger{background:#FEEFEE;color:#E5382D}.tone-neutral{background:#F1F3F7;color:#475467}
.delta-up{color:#12A150}.delta-down{color:#E5382D}

/* rollout */
.progress-stacked{height:10px;border-radius:999px;background:#EEF0F4}
.progress-stacked .progress-bar{background:#025CFD}
.progress-stacked .bar-pilot{background:#8DB3FF}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.progress{--bs-progress-bar-bg:#025CFD;--bs-progress-bg:#EEF0F4;height:8px;border-radius:999px}

/* conversation */
.hears{background:#F3F7FF;border:1px solid #D6E4FF;border-radius:16px 16px 16px 4px;padding:.8rem 1rem}
.hears-label{display:flex;align-items:center;gap:.35rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:#0043BA;margin-bottom:.3rem}
.chat{display:flex;flex-direction:column;gap:.6rem}
.msg{display:flex;flex-direction:column;max-width:86%}
.msg .who{font-size:.72rem;color:var(--hl-muted);font-weight:500;margin-bottom:.2rem}
.msg .bubble{padding:.55rem .85rem;border-radius:14px;font-size:.875rem;line-height:1.45}
.msg.ai{align-self:flex-start}
.msg.ai .bubble{background:#EEF4FF;color:#0F172A;border-top-left-radius:4px}
.msg.caller{align-self:flex-end;align-items:flex-end}
.msg.caller .bubble{background:#F1F3F7;border-top-right-radius:4px}
.player{display:flex;align-items:center;gap:.8rem;border:1px solid var(--hl-line);border-radius:.75rem;padding:.55rem .75rem;background:#fff}
.player .play{width:36px;height:36px;border-radius:50%;background:#025CFD;color:#fff;border:0;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px -3px rgba(2,92,253,.5)}
.player .bars{flex:1;height:30px;display:flex;align-items:center;gap:2px;overflow:hidden}
.player .bars i{flex:1;min-width:2px;border-radius:2px;background:#C9D6EA}
.player .bars i.on{background:#025CFD}
.player.playing .bars i{animation:wv 1.1s ease-in-out infinite alternate}
.player.playing .bars i:nth-child(3n){animation-delay:.25s}
.player.playing .bars i:nth-child(3n+1){animation-delay:.5s}
@keyframes wv{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.linked{border:1px solid #D6E4FF;background:linear-gradient(180deg,#F7FAFF,#fff);border-radius:.875rem}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.45rem 1.25rem;font-size:.875rem;margin:0}
.kv dt{color:var(--hl-muted);font-weight:400}
.kv dd{margin:0;font-weight:500}
.timeline{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.75rem;position:relative}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:.75rem;font-size:.85rem;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #025CFD;margin-top:.3rem}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:4px;top:1.05rem;bottom:-.85rem;width:2px;background:#E5E8EF}

/* misc */
.empty-state .card-body{padding:3rem 1.5rem}
.choice-card{display:flex;gap:.75rem;align-items:flex-start;border:1px solid var(--hl-line-2);border-radius:.75rem;padding:.75rem .9rem;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.choice-card:hover{border-color:#9DBDFF}
.choice-card.on{border-color:#025CFD;background:#F5F8FF;box-shadow:0 0 0 1px #025CFD inset}
.choice-card .form-check-input{margin-top:.2rem;flex:none}
.choice-card small{display:block;color:var(--hl-muted)}
.note-card{display:flex;gap:.6rem;align-items:flex-start;background:#FFFBEB;border:1px dashed #F5C451;color:#7A4E05;border-radius:.75rem;padding:.65rem .85rem;font-size:.8125rem;max-width:72ch}
.alert{--bs-alert-border-radius:.75rem;font-size:.875rem;display:flex;gap:.65rem;align-items:flex-start;padding:.8rem 1rem;margin:0}
.alert .grow{flex:1;min-width:0}
.alert-primary{--bs-alert-bg:#EEF4FF;--bs-alert-border-color:#C9DAFF;--bs-alert-color:#0B2E6E}
.alert-warning{--bs-alert-bg:#FFF8EB;--bs-alert-border-color:#FBDDA0;--bs-alert-color:#7A4A05}
.alert-danger{--bs-alert-bg:#FEF3F2;--bs-alert-border-color:#FECDCA;--bs-alert-color:#912018}
.alert-success{--bs-alert-bg:#ECFDF3;--bs-alert-border-color:#ABEFC6;--bs-alert-color:#085D3A}
.hbar-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 48px;gap:.75rem;align-items:center;font-size:.85rem;padding:.3rem 0}
.hbar-row .track{height:8px;border-radius:999px;background:#EEF0F4;overflow:hidden}
.hbar-row .fill{height:100%;border-radius:999px;background:#025CFD}
.hbar-row .fill.bad{background:#E5382D}
.stepper{display:flex;gap:.5rem;list-style:none;padding:0;margin:0;flex-wrap:wrap}
.stepper li{flex:1 1 110px;display:flex;flex-direction:column;gap:.45rem;font-size:.8125rem;color:#94A3B8;font-weight:500}
.stepper li::before{content:"";height:4px;border-radius:4px;background:#E5E8EF}
.stepper li.done{color:#475467}
.stepper li.done::before{background:#8DB3FF}
.stepper li.cur{color:#025CFD;font-weight:600}
.stepper li.cur::before{background:#025CFD}
.check-list .list-group-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem}
.step-dot{width:32px;height:32px;border-radius:50%;border:1.5px solid #D0D5DD;display:grid;place-items:center;font-weight:600;font-size:.85rem;color:#475467;flex:none;background:#fff}

(function(){

const clock = m => { m=((m%1440)+1440)%1440; let h=Math.floor(m/60); const mm=m%60, ap=h>=12?'pm':'am'; h=h%12||12; return `${h}:${String(mm).padStart(2,'0')} ${ap}`; };

const isOpen = f => !['Resolved','Closed'].includes(f.status);
const isOverdue = f => isOpen(f) && f.due<0;

const callsInScope = () => D.calls.filter(c=>inScope(c.loc));

function polHealth(p){
  const out=[];
  if(p.lock!=='local'&&p.confirmed>60) out.push(`Brand value not confirmed in ${p.confirmed} days`);
  Object.entries(p.ov).forEach(([id,o])=>{ if(!inScope(id)) return; if(o.days>60) out.push(`${L[id].name}: override not confirmed in ${o.days} days`); if(o.conflict) out.push(`${L[id].name}: conflicts with brand policy`); });

}

function toast(msg, extra){ clearTimeout(toastTimer); S.toast={msg, extra:extra||null}; toastTimer=setTimeout(()=>{S.toast=null; render();},7000); }

/* ---------- page-level saves: loading, success (toast) and error (inline) ---------- */
function run(key, apply, okMsg){ S.busy=key; S.err=null; render(); setTimeout(()=>{ S.busy=null; if(S.fail) S.err=key; else { apply(); if(okMsg) toast(okMsg); } render(); }, 650); }

let CH=[], charts=[];
const BLUE='#025CFD', BLUE_L='#B9CFFF', GRID='#EEF0F4', TICK='#64748B';
function chart(cfg,h=200,label='',w=''){ const id='ch'+CH.length; CH.push({id,cfg}); return `<div class="chart-box" style="height:${h}px;${w?`width:${w}px;flex:none`:''}"><canvas id="${id}" role="img" aria-label="${esc(label)}"></canvas></div>`; }
const axes = (yfmt) => ({x:{grid:{display:false},border:{display:false},ticks:{color:TICK,font:{size:11}}}, y:{grid:{color:GRID},border:{display:false},ticks:{color:TICK,font:{size:11},maxTicksLimit:5,callback:yfmt||undefined}}});
const spark = (data,color=BLUE) => ({type:'line', data:{labels:data.map((_,i)=>i), datasets:[{data, borderColor:color, borderWidth:2, pointRadius:0, tension:.4, fill:true, backgroundColor:color===BLUE?'rgba(2,92,253,.10)':'rgba(229,56,45,.08)'}]}, options:{plugins:{legend:{display:false},tooltip:{enabled:false}}, scales:{x:{display:false},y:{display:false}}}});
const barH = (labels,data,colors) => ({type:'bar', data:{labels, datasets:[{data, backgroundColor:colors||BLUE, borderRadius:6, barThickness:14}]}, options:{indexAxis:'y', plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.raw+'%'}}}, scales:{x:{grid:{color:GRID},border:{display:false},ticks:{color:TICK,font:{size:11},callback:v=>v+'%'}}, y:{grid:{display:false},border:{display:false},ticks:{color:'#344054',font:{size:12}}}}}});
function mountCharts(){
  charts.forEach(c=>{ try{ c.destroy(); }catch(e){} }); charts=[];
  if(!window.Chart){ CH=[]; return; }
  CH.forEach(({id,cfg})=>{ const el=document.getElementById(id); if(!el) return; cfg.options=Object.assign({responsive:true, maintainAspectRatio:false, animation:false}, cfg.options||{}); charts.push(new Chart(el,cfg)); });
  CH=[];
}
if(window.Chart){ Chart.defaults.font.family='"Yetson Sans", system-ui, sans-serif'; Chart.defaults.color=TICK; Chart.defaults.plugins.tooltip.backgroundColor='#0F172A'; Chart.defaults.plugins.tooltip.padding=10; Chart.defaults.plugins.tooltip.cornerRadius=8; }

/* ---------- overview ---------- */
function kpis(locs){
  locs=locs.filter(l=>answering(l.id));
  const calls=locs.reduce((a,l)=>a+l.m.calls,0), w=k=>locs.reduce((a,l)=>a+l.m[k]*l.m.calls,0)/Math.max(calls,1), fus=fusInScope();
  return {calls, ans:w('answer'), ai:w('ai'), rev:locs.reduce((a,l)=>a+l.m.rev,0), open:fus.filter(isOpen).length, od:fus.filter(isOverdue).length, trend:Array.from({length:8},(_,i)=>locs.reduce((a,l)=>a+l.m.trend[i],0))};
}
function attention(){
  const locs=scopeLocs(), items=[];
  fusInScope().filter(isOverdue).forEach(f=>items.push({sev:'bad', t:`${f.type} overdue ${span(-f.due)} at ${L[f.loc].name}`, d:`Owner ${f.owner} · ${f.guest.name}`, a:'openfu', v:f.id}));
  D.integrations.filter(x=>x.status==='error'&&inScope(x.err.loc)).forEach(x=>items.push({sev:'bad', t:`${x.name} isn't connected at ${L[x.err.loc].name}`, d:'Reservations can\'t be booked there by phone', a:'integr', v:x.id}));
  if(D.calls.length) locs.filter(l=>status(l.id)==='live'&&l.m.answer<94).forEach(l=>items.push({sev:'bad', t:`${l.name} answers ${pct(l.m.answer)} of calls`, d:`${l.m.failX} failed transfers this week`, a:'loc', v:l.id}));
  locs.filter(l=>status(l.id)==='pilot').forEach(l=>{ const x=D.launch[l.id]; items.push({sev:x.pilotIssues?'warn':'acc', t:`${l.name} is in pilot since ${x.since}`, d:x.pilotIssues?`${plural(x.pilotIssues,'issue')} to review before going live`:'No issues so far. Go live when ready', a:'loc', v:l.id}); });
  D.policies.forEach(p=>{ const h=polHealth(p); if(h.length&&locs.some(l=>l.brand===p.brand)) items.push({sev:'warn', t:`Knowledge: ${p.name}`, d:h[0]+(h.length>1?` · +${h.length-1} more`:''), a:'openpol', v:p.id}); });
  return items;
}
function rolloutBlock(){
  const locs=scopeLocs(), c={setup:0,pilot:0,live:0}; locs.forEach(l=>c[status(l.id)]++);
  const pending=locs.filter(l=>status(l.id)!=='live');
  const body=`<div class="d-flex align-items-end gap-4 mb-3 flex-wrap">${[['live','Live','#025CFD'],['pilot','Pilot','#8DB3FF'],['setup','Setting up','#E5E8EF']].map(([k,t,col])=>`<div><div class="d-flex align-items-center gap-2 small text-secondary"><span class="legend-dot" style="background:${col}"></span>${t}</div><div class="fs-3 fw-semibold tnum lh-1 mt-1">${c[k]}</div></div>`).join('')}<div class="ms-auto text-end"><div class="small text-secondary">Rollout</div><div class="fs-3 fw-semibold tnum lh-1 mt-1">${Math.round(c.live/locs.length*100)}%</div></div></div>

    ${pending.length?`<div class="list-group list-group-flush mx-n3 mb-n3">${pending.slice(0,6).map(l=>{ const s=status(l.id); return `<div class="list-group-item d-flex align-items-center gap-3"><div class="flex-grow-1 min-w-0"><div class="fw-medium">${esc(l.name)}</div><div class="small text-secondary">${s==='setup'?`${stepsDone(l.id)} of 4 launch steps`:`Pilot since ${D.launch[l.id].since} · ${D.launch[l.id].pilotCalls||0} calls`}</div></div>${statusChip(l.id)}<button class="btn btn-sm ${s==='pilot'?'btn-primary':'btn-white'}" data-a="${s==='setup'?'launch':'modal'}" data-v="${s==='setup'?l.id:'golive|'+l.id}">${s==='setup'?(stepsDone(l.id)?'Continue':'Launch'):'Go live'}</button></div>`; }).join('')}${pending.length>6?`<div class="list-group-item small text-secondary">+${pending.length-6} more on Locations</div>`:''}</div>`:'<p class="small text-secondary mb-0">Every location in scope is live.</p>'}`;
  return card('Rollout status', body, `<button class="btn btn-sm btn-link" data-a="goto" data-v="locations">All locations ${I('arrow-right','ic-xs')}</button>`);
}
const kpiCard = (icon,label,value,sub,{tone='',sp=null,alert=false,subCls='text-secondary'}={}) => `<div class="col"><div class="card kpi h-100 ${alert?'kpi-alert':''}"><div class="card-body d-flex flex-column gap-2"><div class="d-flex align-items-center gap-2"><span class="icon-tile icon-tile-sm ${tone?'tone-'+tone:''}">${I(icon)}</span><span class="small text-secondary fw-medium">${label}</span></div><div class="d-flex align-items-end justify-content-between gap-2"><div class="kpi-value">${value}</div>${sp?chart(sp,40,label+' trend',84):''}</div><div class="small ${subCls}">${sub}</div></div></div></div>`;

/* ---------- calls ---------- */
const OUTI = {'Order placed':'shopping-bag','Reservation booked':'calendar-check','Reservation changed':'calendar-clock','Answered':'message-circle','Transferred':'phone-forwarded','Lead captured':'star','Follow-up created':'inbox','Caller hung up':'phone-missed'};
const outcomeChip = o => pill(o, o==='Follow-up created'?'warning':o==='Caller hung up'?'danger':o==='Transferred'?'secondary':o==='Lead captured'?'primary':'success', OUTI[o]);
const LINKI = {Order:'shopping-bag', Reservation:'calendar-check', Lead:'star'};
function callTable(rows){
  return `<div class="card overflow-hidden"><div class="table-responsive"><table class="table table-hover table-click align-middle"><thead><tr><th>Time</th><th>Location</th><th>Intent</th><th>Summary</th><th>Outcome</th><th>Linked</th><th class="num">Length</th></tr></thead><tbody>

    </tbody></table></div></div>`;
}
function pgCalls(){
  const f=S.calls, all=callsInScope();
  if(!all.length) return `${head('Calls', esc(scopeName()))}${empty('phone-off','No calls yet.', `${liveCount()} of 18 locations live${scopeLoc()?`; ${esc(scopeLoc().name)} is ${STATUS[status(scopeLoc().id)][0].toLowerCase()}`:''}. Calls show up here as soon as a restaurant starts its pilot.`, `<button class="btn btn-white" data-a="goto" data-v="locations">Go to Locations</button>`)}`;
  const intents=[...new Set(all.map(c=>c.intent))].sort(), locs=scopeLocs().filter(l=>answering(l.id));
  let rows=all.filter(c=>(!f.intent||c.intent===f.intent)&&(!f.outcome||c.outcome===f.outcome)&&(!f.loc||c.loc===f.loc));
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(c=>(c.summary+' '+c.intent+' '+L[c.loc].name).toLowerCase().includes(q)); }
  return `${head('Calls',`${esc(scopeName())} · ${all.length} calls in the last 48 hours`)}

      ${locs.length>1?`<select class="form-select" style="width:auto" id="calls-loc" data-c="calls.loc" aria-label="Location"><option value="">All locations</option>${locs.map(l=>`<option value="${l.id}" ${f.loc===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select>`:''}

function player(id,len='3:56'){ const on=S.playing===id; return `<div class="player ${on?'playing':''}"><button class="play" data-a="play" data-v="${id}" aria-label="${on?'Pause':'Play'} recording">${I(on?'pause':'play','ic-xs')}</button><div class="bars" aria-hidden="true">${Array.from({length:52},(_,i)=>`<i class="${on&&i<20?'on':''}" style="height:${18+Math.abs(Math.sin(i*1.7+id.length))*82}%"></i>`).join('')}</div><span class="small text-secondary tnum">${on?'0:42':'0:00'} / ${len}</span></div>`; }
const transcript = tx => `<div class="chat">${tx.map(([s,t])=>`<div class="msg ${s==='AI'?'ai':'caller'}"><span class="who">${s==='AI'?'Hostline':'Caller'}</span><div class="bubble">${esc(t)}</div></div>`).join('')}</div>`;

const dueText = f => isOpen(f)?(f.due<0?`Overdue ${span(-f.due)}`:`Due in ${span(f.due)}`):(f.outcome||f.status);

      <select class="form-select form-select-sm" style="width:auto" id="fu-type" data-c="fu.type" aria-label="Type"><option value="">All types</option>${FU_TYPES.map(t=>`<option ${S.fu.type===t?'selected':''}>${t}</option>`).join('')}</select></div>

/* =========================================================
   POPUPS: each has a form, then loading → success or error
   ========================================================= */
function renderModal(){
  const m=S.modal; if(!m) return ''; const def=MODALS[m.type], v=m.state==='success'?{title:m.title, wide:m.wide}:def.view(m);
  let body=v.body, foot;
  if(m.state==='success'){
    body=`<div class="success-state" role="status"><span class="ok">${I('check')}</span><h3 class="h5 mb-0">${esc(m.done.title)}</h3>${m.done.text?`<p class="text-secondary mb-0" style="max-width:48ch">${esc(m.done.text)}</p>`:''}</div>${m.done.extra||''}`;
    foot=`${m.done.next?`<button class="btn btn-white" data-a="${m.done.next.a}" data-v="${esc(m.done.next.v||'')}">${esc(m.done.next.label)}</button>`:''}<button class="btn btn-primary" data-a="mclose">Done</button>`;
  } else {
    if(m.state==='error') body=`<div class="alert alert-danger" role="alert">${I('alert-octagon')}<div class="grow"><b>${esc(v.errTitle||'Couldn\'t save.')}</b> ${esc(v.err||'Nothing changed. Try again.')}</div></div>`+body;
    foot=`<button class="btn btn-white" data-a="mclose" ${m.state==='loading'?'disabled':''}>${v.cancel||'Cancel'}</button><button class="btn ${v.danger?'btn-danger':'btn-primary'}" data-a="submit" ${v.disabled||m.state==='loading'?'disabled':''}>${m.state==='loading'?`<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> ${esc(v.busy||'Saving…')}`:m.state==='error'?I('rotate-ccw','ic-xs')+' Try again':esc(v.primary)}</button>`;
  }
  return `<div class="modal-backdrop fade show"></div><div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="mtitle" aria-busy="${m.state==='loading'}" data-a="mclose" data-self="1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down ${v.wide?'modal-lg':''}"><div class="modal-content"><div class="modal-header"><h2 class="modal-title" id="mtitle">${v.title}</h2><button class="btn-close" data-a="mclose" aria-label="Close"></button></div><div class="modal-body vstack gap-3 ${m.state==='loading'?'busy':''}" data-keep="modal">${body}</div><div class="modal-footer">${foot}</div></div></div></div>`;
}
const choice = (name,dc,opts,cur) => `<div class="vstack gap-2">${opts.map((o,i)=>{ const [val,label,sub]=Array.isArray(o)?o:[o,o,'']; const id=`${name}-${i}`; return `<label class="choice-card ${cur===val?'on':''}" for="${id}"><input class="form-check-input" type="radio" name="${name}" id="${id}" data-c="${dc}" value="${esc(val)}" ${cur===val?'checked':''}><span><span class="fw-medium">${esc(label)}</span>${sub?`<small>${esc(sub)}</small>`:''}</span></label>`; }).join('')}</div>`;
const locSelect = (m,key,locs) => field('Location',`<select class="form-select" id="m-${key}" data-c="modal.${key}">${locs.map(l=>`<option value="${l.id}" ${m[key]===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select>`);

  integr:{ view(m){ const x=D.integrations.find(i=>i.id===m.id), e=x.err; return {title:`${x.name} · connection error`, primary:'Retry connection', busy:'Connecting…', errTitle:'Still not connected.', err:'The token is still expired. The Hostline team has been notified; retry after they confirm.', cancel:'Close', body:`

  resolve:{ view(m){ const f=fuById(m.fu), opts=[...RESOLVE[f.type],'No answer, try again later']; return {title:`Resolve ${f.id}`, primary:m.outcome&&m.outcome.startsWith('No answer')?'Log attempt':'Resolve', disabled:!m.outcome, err:'The follow-up is still open. Try again.', body:`
      <div class="small text-secondary">${esc(f.type)} · ${esc(f.guest.name)} · owner ${esc(f.owner)}</div>
      ${choice('res','modal.outcome',opts.map(o=>[o,o,o.startsWith('No answer')?`Attempt ${f.attempts+1} of 2. ${f.attempts>=1?'This closes it as "Guest unreachable".':'It stays open with a reminder in 1 hour.'}`:'']),m.outcome)}
      ${m.outcome==='Answer added to Knowledge'?`${field(`Answer for ${esc(L[f.loc].name)}`,`<textarea class="form-control" rows="3" id="m-answer" data-i="modal.answer">${esc(m.answer)}</textarea>`)}${hears(m.answer||'…','Next caller hears')}`:

    apply(m){ const f=fuById(m.fu);
      if(m.outcome.startsWith('No answer')){ f.attempts++; f.status='In progress';
        if(f.attempts>=2){ f.status='Closed'; f.outcome='Guest unreachable'; f.log.push([0,`${ME.name}: no answer (attempt 2 of 2). Closed as Guest unreachable`]); return {title:'Closed as Guest unreachable', text:'Two attempts, no answer.'}; }
        f.log.push([0,`${ME.name}: no answer (attempt 1 of 2). Reminder at ${clock(NOW+60)}`]); return {title:'Attempt logged', text:`${f.owner} gets a reminder at ${clock(NOW+60)}.`}; }
      f.status='Resolved'; f.outcome=m.outcome; f.note=m.outcome==='Answer added to Knowledge'?'':m.note;
      if(m.outcome==='Answer added to Knowledge') addLog(`Knowledge: new answer "${(f.guest.facts.find(x=>x[0]==='Question')||['',''])[1]}"`, L[f.loc].name, '—', m.answer.slice(0,50));
      f.log.push([0,`Resolved by ${ME.name}: ${m.outcome}`]); return {title:`${f.id} resolved`, text:`Outcome: ${m.outcome}. ${f.owner} has been notified.`}; } },

  impact:{ view(m){
      const p=D.policies.find(x=>x.id===m.pol), locs=polLocs(p), ovIds=Object.keys(p.ov), names=ovIds.map(id=>L[id].name), nv=p.kind==='number'?Number(S.polDraft.v):S.polDraft.v, forced=m.lock==='locked';

      ${ovIds.length&&!forced?`${choice('pc','modal.choice',[['keep','Keep overrides',`${names.join(', ')} keep their own value.`],['reset','Reset all','Every location uses the new brand value.'],['per','Decide per location','Keep or reset each override.']],m.choice)}
        ${m.choice==='per'?`<div class="list-group">${ovIds.map(id=>`<div class="list-group-item d-flex align-items-center gap-3"><div class="flex-grow-1"><div class="fw-medium">${esc(L[id].name)}</div><div class="small text-secondary">Override: ${esc(fmtVal(p,p.ov[id].v))}</div></div>${seg([[id+'|keep','Keep'],[id+'|reset','Reset']],id+'|'+(m.per[id]||'keep'),'perloc')}</div>`).join('')}</div>`:''}`:''}
      ${hears(spoken(p,nv),'Callers will hear')}
      ${conflict?`<div class="alert alert-danger">${I('git-fork')}<div class="grow"><b>Conflicts with a routing rule.</b> "${esc(rule.when)}" transfers parties of 8+ to the events manager. Callers with 8–${Math.max(8,nv-1)} guests would be transferred before hearing the new policy.
        <div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="m-ack" data-c="modal.ack" ${m.ack?'checked':''}><label class="form-check-label" for="m-ack">Keep the rule, I understand the conflict</label></div></div><button class="btn btn-sm btn-white" data-a="fixrule">Move rule to ${esc(nv)}+</button></div>`:''}
      ${m.ruleFixed?`<div class="alert alert-success">${I('check-circle-2')}<div class="grow">The routing rule moves to parties of ${esc(nv)}+ when you apply.</div></div>`:''}`}; },
    fails(m){ if(S.fail&&!m.version){ m.version=true; return true; } return false; },
    apply(m){ const p=D.policies.find(x=>x.id===m.pol), old=fmtVal(p,p.value), nv=p.kind==='number'?Number(S.polDraft.v):S.polDraft.v;
      const resetIds= m.lock==='locked'||m.choice==='reset'?Object.keys(p.ov): m.choice==='per'?Object.keys(p.ov).filter(id=>m.per[id]==='reset'):[];
      resetIds.forEach(id=>delete p.ov[id]); p.value=nv; p.lock=m.lock; p.confirmed=0; S.polDraft=null;
      if(m.ruleFixed){ const r=D.rules.find(x=>x.id===p.rule); r.when=`Reservation for ${nv}+ guests`; }
      const n=polLocs(p).length; addLog(`Policy: ${p.name}${resetIds.length?` (reset ${resetIds.length} overrides)`:''}`, `${BRANDS[p.brand].name} (${n} locations)`, old, fmtVal(p,nv));
      return {title:`Live on the next call at ${n} locations`, text:`${p.name}: ${old} → ${fmtVal(p,nv)}.${resetIds.length?` ${resetIds.length} overrides reset; GMs notified.`:''}`, next:{label:'View change log', a:'ktab', v:'changelog'}}; } },
  soldout:{ view(m){ const it=D.menu.find(x=>x.id===m.item), l=L[m.loc], linked=(it.linked||[]).map(id=>D.menu.find(x=>x.id===id)), locs=scopeLocs().filter(x=>x.brand===it.brand);

  closeslot:{ view(m){ return {title:'Close a date or slot', primary:'Close for bookings', err:'Bookings are still open. Try again.', body:`

  hours:{ view(m){ const bad=m.h.some(d=>d.kitchen>d.close), gaps=m.h.filter(d=>d.close-d.kitchen>=45);

  export:{ view(m){ const secs=['Calls and outcomes','AI resolution rate','Revenue from calls','Follow-up performance','Escalations','Location comparison','Unanswered questions'];
      return {title:'Export CSV', primary:'Export', busy:'Preparing…', disabled:!m.secs.some(Boolean), err:'The export didn\'t finish. Try again.', body:`<div class="small text-secondary">${esc(scopeName())} · ${PERIOD[S.rep.period][0]}</div>

    apply(m){ const locs=repLocs(), mult=PERIOD[S.rep.period][1], s=m.secs, hdr=['location','brand','region','status'];

function goPage(p){ S.page=p; S.drawer=null; S.locId=null; S.polDraft=null; S.local=null; S.err=null; scrollTop(); }
const fuById = id => D.fus.find(f=>f.id===id);
const A={
  goto(v){ goPage(v); },
  menu(v){ S.menu=S.menu===v?null:v; },
  setscope(v){ S.scope=v; S.locId=null; S.polDraft=null; S.local=null; S.calls.loc=''; S.rep.loc='all'; S.kLoc=null; S.resvDraft=null; },
  notifs(){ S.drawer={kind:'notifs'}; },
  notif(v){ const n=notifs().find(x=>x.id===v); D.read.add(v); S.drawer=null; if(n) A[n.a](n.v); },
  readall(){ notifs().forEach(n=>D.read.add(n.id)); },
  closedrawer(){ S.drawer=null; S.playing=null; },
  call(v){ S.drawer={kind:'call', id:v}; },
  play(v){ S.playing=S.playing===v?null:v; },
  openfu(v){ goPage('followups'); const f=fuById(v); S.fu.tab=f&&!isOpen(f)?'closed':'open'; S.fu.type=''; S.fu.sel=v; },
  selfu(v){ S.fu.sel=v||null; S.playing=null; },
  futab(v){ S.fu.tab=v; },
  openpol(v){ goPage('knowledge'); S.ktab='policies'; S.brand=D.policies.find(x=>x.id===v).brand; S.polId=v; },
  selpol(v){ S.polId=v||null; S.polDraft=null; S.local=null; S.err=null; },
  ktab(v){ S.modal=null; if(S.page!=='knowledge'||S.screen!=='app'){ S.screen='app'; goPage('knowledge'); } S.ktab=v; S.polDraft=null; S.local=null; S.err=null; },
  brand(v){ S.brand=v; S.polId=null; },
  loc(v){ goPage('locations'); S.locId=v; S.locTab='overview'; },
  locback(){ S.locId=null; },
  loctab(v){ S.locTab=v; },
  lfilter(v){ S.lfilter=v; },
  sort(v){ if(S.sort.k===v) S.sort.d*=-1; else S.sort={k:v,d:['name','status','answer','ai','calls'].includes(v)?1:-1}; },
  repperiod(v){ S.rep.period=v; },
  stab(v){ S.stab=v; S.profileDraft=null; S.err=null; },
  gosettings(v){ goPage('settings'); S.stab=v; },
  integr(v){ A.modal('integr|'+v); },
  opensetup(){ S.screen='setup'; S.setupStep=null; S.drawer=null; scrollTop(); },
  logout(){ S.screen='login'; S.auth={email:ME.email, pw:'', err:null}; S.drawer=null; },
  toastx(){ S.toast=null; },
  reset(){ const n=S.notes, mode=D.ws; initData(mode); initState(); S.notes=n; if(mode==='new') S.screen='invite'; toast('Sample data reset.'); },
  modal(v){
    const i=v.indexOf('|'), type=i<0?v:v.slice(0,i), arg=i<0?'':v.slice(i+1), m={type, state:'form'};
    S.toast=null;
    if(['resolve','reassign','closefu'].includes(type)){ const f=fuById(S.fu.sel); m.fu=f.id; m.note=''; if(type==='resolve'){ m.outcome=null; m.answer=f.loc==='pier21'?'Yes, we have a kids\' brunch menu on Sundays from 10 am to 2 pm.':'Yes, we offer vegan mozzarella on any pizza for $2.'; } }
    if(type==='editloc'){ const l=L[arg]; Object.assign(m,{id:l.id, orig:l.name, name:l.name, brand:l.brand, region:l.region, addr:l.addr, gm:l.gm, main:l.main}); }
    if(type==='sample') m.loc=LOCS.find(l=>l.brand===S.voiceBrand).id;
    if(type==='invite') Object.assign(m,{email:'', role:'Admin'});
    if(type==='role'||type==='remove'){ m.i=Number(arg); m.role=D.team[m.i].role; }
    if(type==='rule'){ if(arg==='new') Object.assign(m,{id:'new', when:'', then:'Transfer', dest:'Phone number', num:'', scope:'All locations'});
      else if(arg.startsWith('line:')) Object.assign(m,{id:arg, when:'Caller asks for a manager', then:'Transfer', dest:'Location manager line', num:D.phones[arg.slice(5)].transfer, scope:L[arg.slice(5)].name});
      else { const r=D.rules.find(x=>x.id===arg); Object.assign(m,{id:r.id, when:r.when, then:r.then, dest:r.dest, num:r.num, scope:r.scope}); } }
    if(type==='xfer') m.loc=arg;
    if(type==='integr') m.id=arg;
    if(type==='impact') Object.assign(m,{pol:S.polId, lock:D.policies.find(x=>x.id===S.polId).lock, choice:'keep', per:{}, ack:false, ruleFixed:false});
    if(type==='avail'||type==='itemnote'){ m.item=arg; m.loc=S.kLoc; m.note=(D.menu.find(x=>x.id===arg).note)||''; }
    if(type==='closeslot') Object.assign(m,{loc:S.kLoc||scopeLocs()[0].id, date:'Sat Oct 3', slot:'All day', reason:''});
    if(type==='reopen'){ m.i=Number(arg); m.loc=S.kLoc; }
    if(type==='hours'){ m.loc=S.kLoc; m.h=JSON.parse(JSON.stringify(D.hours[S.kLoc])); }
    if(type==='event'){ const sl=scopeLoc(); Object.assign(m,{name:'', date:'Sat Oct 31', time:'5:00 pm – 10:00 pm', where:sl?sl.id:'all:hk', resv:'Open', hears:''}); }
    if(type==='export') m.secs=[true,true,true,true,true,true,false];
    if(type==='pilot'){ m.loc=arg; m.notify=true; }
    if(type==='golive'){ m.loc=arg; m.fwd=false; }
    S.modal=m;
  },
  submit(){ const m=S.modal, def=MODALS[m.type]; m.state='loading'; render();
    setTimeout(()=>{ if(S.modal!==m) return; const failed=def.fails?def.fails(m):S.fail;
      if(failed) m.state='error'; else { const v=def.view(m); m.title=v.title; m.wide=v.wide; m.done=def.apply(m); m.state='success'; }
      render(); }, 800); },
  mclose(){ if(S.modal&&S.modal.state==='loading') return; S.modal=null; if(S.playing==='sample') S.playing=null; },
  mset(v){ const i=v.indexOf('|'); S.modal[v.slice(0,i)]=v.slice(i+1); },
  soldout(v){ A.modal('soldout'); Object.assign(S.modal,{item:v, loc:S.kLoc, dur:'close', time:1290, linked:true}); },
  perloc(v){ const [id,c]=v.split('|'); S.modal.per[id]=c; },
  fixrule(){ S.modal.ruleFixed=true; S.modal.ack=false; },
  copycsv(){ const t=S.modal.csv, sel=()=>{ const el=document.getElementById('m-csv'); if(el){ el.focus(); el.select(); } }; try{ navigator.clipboard.writeText(t).then(()=>{ toast('CSV copied.'); render(); }, sel); }catch(e){ sel(); } },
  dlcsv(){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([S.modal.csv],{type:'text/csv'})); a.download=`hostline-report-${S.rep.period}.csv`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} toast('Download started. If nothing happens, use Copy.'); },
  poledit(){ const p=D.policies.find(x=>x.id===S.polId); S.polDraft={id:p.id, v:p.id==='P1'?10:p.value}; },
  poldraftx(){ S.polDraft=null; },
  polconfirm(){ const p=D.policies.find(x=>x.id===S.polId); run('confirm'+p.id, ()=>{ p.confirmed=0; Object.entries(p.ov).forEach(([id,o])=>{ if(inScope(id)) o.days=0; }); addLog(`Knowledge: ${p.name} confirmed`, scopeName(), '—', 'Confirmed'); }, 'Confirmed. The health check resets for 60 days.'); },
  localedit(){ const p=D.policies.find(x=>x.id===S.polId), e=effective(p,scopeLoc().id); S.local={id:p.id, v:e.v==null?'':e.v}; S.err=null; },
  localx(){ S.local=null; S.err=null; },
  localsave(){ const p=D.policies.find(x=>x.id===S.polId), l=scopeLoc(), v=p.kind==='number'?Number(S.local.v):S.local.v;
    run('local', ()=>{ const prev=p.ov[l.id]; p.ov[l.id]={v, by:ME.name, days:0}; addLog(`Policy override: ${p.name}`, l.name, prev?fmtVal(p,prev.v):fmtVal(p,p.value), fmtVal(p,v)); S.local=null; }, `Saved. Live on the next call at ${l.name}.`); },
  localreset(){ const p=D.policies.find(x=>x.id===S.polId), l=scopeLoc(); run('localreset', ()=>{ const prev=p.ov[l.id]; delete p.ov[l.id]; S.local=null; addLog(`Policy override removed: ${p.name}`, l.name, fmtVal(p,prev.v), fmtVal(p,p.value)); }, `${l.name} now uses the brand value.`); },
  resvsave(){ const Dr=S.resvDraft; run('resv', ()=>{ const R=D.resv[Dr.loc]; addLog('Reservation rules', L[Dr.loc].name, `max ${R.max}, ${R.window} days, ${R.dur} min`, `max ${Dr.max}, ${Dr.window} days, ${Dr.dur} min`); Object.assign(R,{max:Number(Dr.max), window:Number(Dr.window), dur:Number(Dr.dur)}); S.resvDraft=null; }, 'Booking rules saved. Live on the next call.'); },
  resvx(){ S.resvDraft=null; S.err=null; },
  voicebrand(v){ S.voiceBrand=v; S.voiceDraft=null; S.err=null; },
  voiceset(v){ const [k,val]=v.split('|'); if(!S.voiceDraft) S.voiceDraft={...D.voice[S.voiceBrand]}; S.voiceDraft[k]=val; },
  voicex(){ S.voiceDraft=null; S.err=null; },
  voicesave(){ const b=S.voiceBrand; run('voice', ()=>{ const prev=D.voice[b]; D.voice[b]=S.voiceDraft; S.voiceDraft=null; addLog('Voice & greeting updated', `${BRANDS[b].name} (${LOCS.filter(l=>l.brand===b).length} locations)`, `${prev.voice} · ${prev.tone}`, `${D.voice[b].voice} · ${D.voice[b].tone}`); }, `Live on the next call at every ${BRANDS[b].name} location.`); },
  profilesave(){ run('profile', ()=>{ D.prefs=S.profileDraft.prefs; S.profileDraft=null; }, 'Profile and notification settings saved.'); },
  profilex(){ S.profileDraft=null; S.err=null; },
  pwreset(){ toast(`We sent a password reset link to ${ME.email}.`); },
  scr(v){ S.screen=v; S.auth.err=null; S.err=null; scrollTop(); },
  createaccount(){ run('signup', ()=>{ S.screen='setup'; S.setupStep=null; scrollTop(); }); },
  setupstep(v){ S.setupStep=v||null; S.err=null; S.voiceDraft=null; scrollTop(); },
  setupdone(v){ run('setup-'+v, ()=>{ if(v==='voice'&&S.voiceDraft){ const b=S.voiceBrand; D.voice[b]=S.voiceDraft; S.voiceDraft=null; addLog('Voice & greeting updated', BRANDS[b].name, '—', D.voice[b].voice+' · '+D.voice[b].tone); } D.setup[v]=true; const next=SSTEPS.find(s=>!D.setup[s[0]]); S.setupStep=next?next[0]:null; scrollTop(); }, 'Step saved.'); },
  setupexit(){ S.screen='app'; goPage('overview'); },
  setupfinish(){ S.screen='app'; goPage('locations'); S.lfilter='all'; toast('Workspace is set up. Launch your first restaurant.'); },
  launch(v){ const l=L[v], x=D.launch[v], first=LSTEPS.findIndex(([k])=>!x.steps[k]);
    S.lw={loc:v, step:first<0?3:first, hours:JSON.parse(JSON.stringify(D.hours[v])), off:{}, resv:{max:D.resv[v].max, window:D.resv[v].window, dur:D.resv[v].dur}, test:false, ok:false};
    D.menu.filter(m=>m.brand===l.brand).forEach(it=>{ const a=D.avail[v+':'+it.id]; if(a&&a.until==='manual') S.lw.off[it.id]=true; });
    S.screen='launch'; S.drawer=null; S.err=null; scrollTop(); },
  lwnext(){ const w=S.lw, k=LSTEPS[w.step][0], x=D.launch[w.loc];
    run('lw-'+k, ()=>{
      if(k==='hours') D.hours[w.loc]=JSON.parse(JSON.stringify(w.hours));
      if(k==='menu') D.menu.filter(m=>m.brand===L[w.loc].brand).forEach(it=>{ const key=w.loc+':'+it.id; if(w.off[it.id]) D.avail[key]={until:'manual', by:ME.name, at:NOW}; else if(D.avail[key]&&D.avail[key].until==='manual') delete D.avail[key]; });
      if(k==='resv') Object.assign(D.resv[w.loc],{max:Number(w.resv.max), window:Number(w.resv.window), dur:Number(w.resv.dur)});
      x.steps[k]=true; addLog(`Launch: ${LSTEPS[w.step][1].toLowerCase()} confirmed`, L[w.loc].name, '—', `${stepsDone(w.loc)} of 4 steps`); w.step++; scrollTop(); }); },
  lwback(){ S.lw.step--; S.err=null; scrollTop(); },
  lwexit(){ const id=S.lw.loc; S.screen='app'; goPage('locations'); S.locId=id; S.lw=null; toast('Progress saved.'); },
  lwtest(){ S.lw.test=true; S.playing='lwtest'; },
  login(){ const a=S.auth; if(!a.email||!a.pw){ a.err='Enter your email and password.'; return; } a.err=null; S.busy='login'; render(); setTimeout(()=>{ S.busy=null; if(S.fail) a.err='That email and password don\'t match. Try again or reset your password.'; else { S.screen='app'; goPage('overview'); } render(); }, 650); },
  sendreset(){ if(!/.+@.+\..+/.test(S.auth.email)){ S.auth.err='Enter your full work email.'; return; } S.auth.err=null; S.busy='reset'; render(); setTimeout(()=>{ S.busy=null; if(S.fail) S.auth.err='We couldn\'t send the email. Try again in a minute.'; else S.screen='resetSent'; render(); }, 650); }
};

/* ---------- change & input ---------- */
function setPath(path,val){ const ks=path.split('.'); let o=S; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]; if(o==null) return; } o[ks[ks.length-1]]=val; }
const C={
  start(v){ S.modal=null; S.drawer=null; S.menu=null; S.toast=null; S.err=null;
    if(v==='login'){ S.screen='login'; S.auth={email:ME.email, pw:'', err:null}; return; }
    const n=S.notes, f=S.fail; initData(v==='new'?'new':'active'); initState(); S.notes=n; S.fail=f;
    if(v==='new') S.screen='invite'; },
  fail(v,el){ S.fail=el.checked; },
  notes(v,el){ S.notes=el.checked; },
  kLoc(v){ S.kLoc=v; S.resvDraft=null; S.err=null; },
  quiet(v,el){ S.profileDraft=profileData(); S.profileDraft.quiet=el.checked; },
  lwok(v,el){ S.lw.ok=el.checked; },
  'modal.linked'(v,el){ S.modal.linked=el.checked; },
  'modal.ack'(v,el){ S.modal.ack=el.checked; },
  'modal.fwd'(v,el){ S.modal.fwd=el.checked; },
  'modal.notify'(v,el){ S.modal.notify=el.checked; }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){ if(S.menu&&!e.target.closest('.menu')){ S.menu=null; render(); } return; }
  if(el.disabled) return; if(el.dataset.self&&e.target!==el) return;
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault(); if(el.dataset.a!=='menu') S.menu=null;
  fn(el.dataset.v||'', el, e); render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.menu) S.menu=null; else if(S.modal&&S.modal.state!=='loading') S.modal=null; else if(S.drawer) S.drawer=null; else return; render(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset.c; if(!k) return;
  const p=k.split('|');
  if(p[0]==='h') S.modal.h[Number(p[1])][p[2]]=Number(el.value);
  else if(p[0]==='lwh') S.lw.hours[Number(p[1])][p[2]]=Number(el.value);
  else if(p[0]==='lwmenu') S.lw.off[p[1]]=!el.checked;
  else if(p[0]==='exsec') S.modal.secs[Number(p[1])]=el.checked;
  else if(p[0]==='pref'){ S.profileDraft=profileData(); S.profileDraft.prefs[p[1]][p[2]]=el.checked; }
  else if(p[0]==='lock'){ const pol=D.policies.find(x=>x.id===p[1]), old=LOCK[pol.lock][0]; pol.lock=el.value; addLog(`Policy lock: ${pol.name}`, BRANDS[pol.brand].name, old, LOCK[pol.lock][0]); toast(`${pol.name}: ${LOCK[pol.lock][0]}.`); }
  else if(C[k]) C[k](el.value, el);
  else setPath(k, el.value);
  render();
});
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset.i; if(!k) return;
  if(k.startsWith('profileDraft.')) S.profileDraft=profileData();
  if(k.startsWith('voiceDraft.')&&!S.voiceDraft) S.voiceDraft={...D.voice[S.voiceBrand]};
  if(k.startsWith('resvDraft.')&&(!S.resvDraft||S.resvDraft.loc!==S.kLoc)){ const R=D.resv[S.kLoc]; S.resvDraft={loc:S.kLoc, max:R.max, window:R.window, dur:R.dur}; }
  setPath(k, el.value); render();
});


initData('active'); initState(); render();
})();
</script>
</body>
