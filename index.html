<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostline Wireframe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
:root{
  --paper:#F3F4F1; --surface:#FFFFFF; --sunk:#EAECE8; --ink:#1E2124; --ink2:#4B5157; --muted:#6F757C;
  --line:#B7BCC2; --faint:#DCDFE2;
  --accent:#2450D3; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --sticky:#FFF0A0; --sticky-ink:#4A3F00;
  --bad:#B3342A; --bad-soft:#F7E2DF; --warn:#8C6310; --warn-soft:#F6ECD4; --good:#2C6E45; --good-soft:#DFEFE4;
  --bar:#1E2124; --bar-ink:#F3F4F1; --bar-muted:#A8AEB5;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-note:"Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141619; --surface:#1C1F23; --sunk:#24282D; --ink:#E6E8EA; --ink2:#BDC2C8; --muted:#8D939A;
    --line:#4A5058; --faint:#2F343A;
    --accent:#8DA8FF; --accent-ink:#0E1220; --accent-soft:#1E2946;
    --sticky:#3D3717; --sticky-ink:#F1E4A0;
    --bad:#F08A7E; --bad-soft:#3A201D; --warn:#E2B45B; --warn-soft:#382D16; --good:#80C69A; --good-soft:#1A2F22;
    --bar:#0B0C0E; --bar-ink:#E6E8EA; --bar-muted:#8D939A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141619; --surface:#1C1F23; --sunk:#24282D; --ink:#E6E8EA; --ink2:#BDC2C8; --muted:#8D939A;
  --line:#4A5058; --faint:#2F343A;
  --accent:#8DA8FF; --accent-ink:#0E1220; --accent-soft:#1E2946;
  --sticky:#3D3717; --sticky-ink:#F1E4A0;
  --bad:#F08A7E; --bad-soft:#3A201D; --warn:#E2B45B; --warn-soft:#382D16; --good:#80C69A; --good-soft:#1A2F22;
  --bar:#0B0C0E; --bar-ink:#E6E8EA; --bar-muted:#8D939A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:24px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.sp{justify-content:space-between}

/* prototype control bar */
.bar{background:var(--bar);color:var(--bar-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px 20px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:13px}
.bar b{font-size:14px}
.bar .tag{color:var(--bar-muted)}
.bar-ctl{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.bar select,.bar button{background:transparent;border:1px solid var(--bar-muted);color:var(--bar-ink);border-radius:var(--r);padding:4px 8px;cursor:pointer}
.bar select option{color:#1E2124;background:#fff}
.bar .seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* segmented control */
.seg{display:inline-flex;border-radius:var(--r);overflow:hidden}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}
.seg button:last-child{border-radius:0 var(--r) var(--r) 0}

/* app shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 48px)}
.side{border-right:1.5px solid var(--line);background:var(--surface);padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;padding:0 6px}
.logo i{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--ink2)}
.nav button:hover{background:var(--sunk)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button.on{background:var(--ink);color:var(--paper);font-weight:700}
.nav .subnav button{padding-left:24px;font-size:14px}
.nav .count{font-family:var(--f-mono);font-size:12px;border:1px solid currentColor;border-radius:10px;padding:0 6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1.5px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.scope{display:flex;gap:8px;align-items:center}
.scope select{border:1.5px solid var(--ink);border-radius:var(--r);padding:6px 10px;background:var(--surface);font-weight:700;max-width:260px}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunk);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px}

/* primitives */
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.box > h2,.box > .boxhead{margin-bottom:12px}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--bad)}
.kpi.alert .v{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;line-height:20px;white-space:nowrap;background:var(--surface);color:var(--ink2)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.chip.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}

.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--sunk)}
.t th button{all:unset;cursor:pointer}
.t th button:focus-visible{outline:2px solid var(--accent)}
.t td{padding:9px 12px;border-bottom:1px solid var(--faint);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.t td.worst{color:var(--bad);font-weight:700}
.t .sub{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid transparent;margin-bottom:-1.5px;color:var(--ink2)}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:13px;font-weight:700}
.input,select.input,textarea.input{border:1.5px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--surface);width:100%}
textarea.input{min-height:78px;resize:vertical}
.input:focus{border-color:var(--ink);outline:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;min-width:0}
.filters input.input{flex:1 1 200px}

.choice{display:flex;flex-direction:column;gap:6px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;background:var(--surface)}
.choice label.on{border-color:var(--ink);background:var(--sunk)}
.choice input{margin-top:3px;accent-color:var(--ink)}
.choice small{display:block;color:var(--muted)}

.banner{border:1.5px solid var(--line);border-left-width:5px;border-radius:var(--r);padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner .grow{flex:1 1 220px}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner.good{border-color:var(--good);background:var(--good-soft)}
.banner.info{border-color:var(--accent);background:var(--accent-soft)}

.hears{margin:0;border:1.5px dashed var(--ink2);border-radius:14px 14px 14px 3px;padding:10px 14px;background:var(--sunk)}
.hears figcaption{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.hears figcaption::before{content:"";width:14px;height:10px;border:1.5px solid var(--muted);border-radius:2px 8px 8px 2px}
.hears blockquote{margin:0;font-size:15px}

.ph{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border:1.5px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.wave{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.wave .bars{flex:1;height:28px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave .bars i{flex:1;background:var(--line);border-radius:1px;min-width:2px}
.wave.playing .bars i{animation:pl 1.2s ease-in-out infinite alternate}
.wave.playing .bars i:nth-child(odd){animation-delay:.3s}
@keyframes pl{to{background:var(--ink)}}
.playbtn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:11px;flex:none}

.transcript{display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:14px}
.tl b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.tl.ai span{color:var(--ink)}
.tl.caller span{color:var(--ink2)}

.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--faint)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--sunk)}
.li .grow p{font-size:13px;color:var(--muted)}

.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.hbar .track{height:14px;background:var(--sunk);border-radius:2px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink2)}
.hbar .fill.bad{background:var(--bad)}
.hbar .v{text-align:right;font-family:var(--f-mono);font-size:12px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1.5px solid var(--line);padding-top:10px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vbars i{width:100%;background:var(--line);border-radius:2px 2px 0 0;display:block}
.vbars div:last-child i{background:var(--ink)}
.vbars span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vlabels{display:flex;gap:8px}
.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}

/* design notes */
.note{font-family:var(--f-note);background:var(--sticky);color:var(--sticky-ink);padding:8px 12px;border-radius:2px;font-size:15px;line-height:1.35;transform:rotate(-.4deg);box-shadow:1px 2px 0 rgba(0,0,0,.08);max-width:62ch}
.note b{font-weight:700}
.note.r{transform:rotate(.5deg)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,22,25,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1.5px solid var(--ink);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{padding:14px 18px;border-bottom:1.5px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.drawer-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer-foot{padding:12px 18px;border-top:1.5px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r);font-size:18px;flex:none}
.x:hover{background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
.popover{position:absolute;right:24px;top:56px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);z-index:30;padding:6px 14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:40;max-width:calc(100% - 32px);flex-wrap:wrap;font-size:14px}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.toast button:focus-visible{outline:2px solid var(--accent)}

/* mobile stage */
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:28px 16px;flex-wrap:wrap}
.stage-notes{display:flex;flex-direction:column;gap:14px;max-width:330px;padding-top:10px}
.phone{width:390px;max-width:100%;height:780px;border:10px solid var(--ink);border-radius:38px;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column}
.p-status{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;padding:10px 22px 4px;font-weight:600}
.p-head{padding:6px 18px 10px;border-bottom:1.5px solid var(--line);display:flex;gap:10px;align-items:center}
.p-head h2{font-size:18px}
.p-body{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.p-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--line);background:var(--surface)}
.p-tabs button{all:unset;cursor:pointer;text-align:center;padding:8px 2px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.p-tabs button i{width:22px;height:18px;border:1.5px solid currentColor;border-radius:4px;display:block}
.p-tabs button.on{color:var(--ink);font-weight:700}
.p-tabs button.on i{background:var(--ink)}
.p-tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;font-family:var(--f-mono)}
.p-card{border:1.5px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.p-card.click{cursor:pointer}
.p-card.click:hover{background:var(--sunk)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{all:unset;cursor:pointer;border:1.5px solid var(--ink);border-radius:8px;padding:12px 6px;text-align:center;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}
.qa button i{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--ink2)}
.qa button:hover{background:var(--sunk)}
.qa button:focus-visible{outline:2px solid var(--accent)}
.sheet-scrim{position:absolute;inset:0;background:rgba(20,22,25,.4);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-top:1.5px solid var(--ink);border-radius:16px 16px 0 0;z-index:6;display:flex;flex-direction:column}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;border-bottom:1px solid var(--faint)}
.sheet-body{overflow-y:auto;padding:14px 16px 22px;display:flex;flex-direction:column;gap:12px}
.p-banner{position:absolute;left:10px;right:10px;top:34px;z-index:8;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13px}
.p-banner b{display:block;font-size:14px}
.p-toast{position:absolute;left:12px;right:12px;bottom:74px;z-index:4;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.p-toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;margin-left:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--faint);cursor:pointer}
.item:hover{background:var(--sunk)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:18px;padding:6px 12px;font-size:13px}
.pills button.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.pills button:focus-visible{outline:2px solid var(--accent)}
.status-live{display:flex;gap:8px;align-items:center;font-weight:700}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:13px;border-left:2px solid var(--faint);padding-left:12px}
.timeline div span{color:var(--muted)}
details summary{cursor:pointer;font-weight:700;font-size:14px}

@media (max-width:1000px){
  .split,.grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1.5px solid var(--line);padding:10px 12px;gap:8px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav .subnav{display:contents}
  .nav .subnav button{padding-left:10px}
  .side-foot{display:none}
  .content{padding:16px}
  .topbar{padding:10px 16px;position:static}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .who span.name{display:none}
  .phone{height:720px;border-width:6px;border-radius:26px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .note{transform:none}
}

function roleLocs(){ const r=S.role; return r==='rm'?LOCS.filter(l=>l.region==='coastal'): r==='gm'?[L.pier21]:LOCS; }
function scopeLocs(){ const base=roleLocs(); const s=S.scope; if(s==='all') return base; if(s.startsWith('r:')) return base.filter(l=>l.region===s.slice(2)); if(s.startsWith('b:')) return base.filter(l=>l.brand===s.slice(2)); return base.filter(l=>l.id===s.slice(2)); }
function inScope(id){ return scopeLocs().some(l=>l.id===id); }
function scopeLoc(){ return S.scope.startsWith('l:')?L[S.scope.slice(2)]:null; }
function scopeName(){ const s=S.scope; if(s==='all') return S.role==='rm'?'Coastal region':'All locations'; if(s.startsWith('r:')) return REGIONS[s.slice(2)].name+' region'; if(s.startsWith('b:')) return BRANDS[s.slice(2)].name; return L[s.slice(2)].name; }
function defaultScope(r){ return r==='rm'?'r:coastal': r==='gm'?'l:pier21':'all'; }
const can = {
  editBrand:()=>S.role==='hq',
  editTone:()=>S.role==='hq'||S.role==='gx',
  lock:()=>S.role==='hq',
  editLocal:()=>S.role!=='gx',
  team:()=>S.role==='hq',
  integrations:()=>S.role==='hq',
  routing:()=>({hq:'full',gx:'suggest',rm:'local',gm:'local'})[S.role]
};
function fuVisible(f){ if(!roleLocs().some(l=>l.id===f.loc)) return false; if(S.role==='gx') return GX_TYPES.includes(f.type); return true; }
const isOpen = f => !['Resolved','Closed'].includes(f.status);
const isOverdue = f => isOpen(f) && f.due<0;
function fusInScope(){ return D.fus.filter(f=>fuVisible(f)&&inScope(f.loc)); }
function callsInScope(){ return D.calls.filter(c=>inScope(c.loc)); }

/* ---------- knowledge helpers ---------- */
function polLocs(p){ return LOCS.filter(l=>l.brand===p.brand); }
function effective(p,locId){ const o=p.ov[locId]; if(o) return {v:o.v, src:'override', o}; if(p.lock==='local') return {v:null, src:'missing'}; return {v:p.value, src:'brand'}; }
function spoken(p,v){ if(v==null||v==='') return 'I don\'t have that information. I\'ll ask the team to get back to you.'; return p.tpl?p.tpl(v):v; }
function fmtVal(p,v){ if(v==null||v==='') return '—'; return p.kind==='number'?`${v} ${p.unit}`:v; }
function polHealth(p){
  const issues=[];
  if(p.lock!=='local' && p.confirmed>60) issues.push(`Brand value not confirmed in ${p.confirmed} days`);
  Object.entries(p.ov).forEach(([id,o])=>{ if(!inScope(id)) return; if(o.days>60) issues.push(`${L[id].name}: override not confirmed in ${o.days} days`); if(o.conflict) issues.push(`${L[id].name}: conflicts with brand policy`); });
  if(p.lock==='local') polLocs(p).filter(l=>inScope(l.id)&&!p.ov[l.id]).forEach(l=>issues.push(`${l.name}: no answer on file`));
  return issues;
}

function itemState(locId,it){ const a=D.avail[locId+':'+it.id]; if(!a) return {k:'ok'}; if(a.pos) return {k:'pos'}; return {k:'sold', a}; }

      ${sh.dur==='time'?`<select class="input" id="m-so-time" data-c="m.sheet.time" style="margin-top:6px">${[1260,1290,1320,1350].map(t=>`<option value="${t}" ${Number(sh.time)===t?'selected':''}>${clock(t)}</option>`).join('')}</select>`:''}</div>
      ${linked.length?`<label class="row small p-card"><input type="checkbox" id="m-so-linked" data-c="m.sheet.linked" ${sh.linked?'checked':''}> <span>Also affects: <b>${linked.map(l=>esc(l.name)).join(', ')}</b></span></label>`:''}
      ${hears(`Sorry, the ${it.name.toLowerCase()} is sold out tonight.${it.alt?` Can I suggest ${it.alt}?`:''}`,'If a caller asks')}
      ${sh.err?`<div class="banner bad"><div class="grow small"><b>Couldn't save.</b> Hostline is still offering ${esc(it.name)}. Check your signal and try again.</div></div><button class="btn pri full" data-a="msoldsave">Retry</button>`:`<button class="btn pri full" data-a="msoldsave">Mark sold out</button>`}
      <button class="btn full" data-a="msoldback">Back</button></div>`;
  }
  if(sh.type==='pause') return `<div class="sheet-head"><h2>Pause orders</h2>${x}</div><div class="sheet-body">
    <div class="field"><span>Which orders?</span><div class="pills">${['Pickup','Delivery','All'].map(v=>`<button class="${sh.what===v?'on':''}" data-a="mset" data-v="what|${v}">${v}</button>`).join('')}</div></div>
    <div class="field"><span>For how long?</span><div class="pills">${[['15','15 min'],['30','30 min'],['60','1 hour'],['0','Until I resume']].map(([v,t])=>`<button class="${sh.mins===v?'on':''}" data-a="mset" data-v="mins|${v}">${t}</button>`).join('')}</div></div>
    ${hears(`Our kitchen is very busy right now, so we've paused ${sh.what==='All'?'':sh.what.toLowerCase()+' '}orders${sh.mins!=='0'?` for about ${sh.mins} minutes`:''}. I can book you a table instead.`,'Callers hear')}
    ${sh.err?`<div class="banner bad"><div class="grow small"><b>Couldn't save.</b> Orders are still open. Try again.</div></div>`:''}
    <button class="btn pri full" data-a="mpausesave">${sh.err?'Retry':'Pause '+sh.what.toLowerCase()+' orders'}</button></div>`;
  if(sh.type==='close') return `<div class="sheet-head"><h2>Close early tonight</h2>${x}</div><div class="sheet-body">
    <div class="field"><span>Last seating / close at</span><div class="pills">${[1230,1260,1290,1320].map(t=>`<button class="${sh.at===t?'on':''}" data-a="mset" data-v="at|${t}">${clock(t)}</button>`).join('')}</div></div>
    <div class="field"><span>Reason (for HQ)</span><div class="pills">${['Kitchen slammed','Short-staffed','Weather','Private event'].map(v=>`<button class="${sh.reason===v?'on':''}" data-a="mset" data-v="reason|${v}">${v}</button>`).join('')}</div></div>
    <div class="banner warn"><div class="grow small"><b>${sh.at<=1260?4:2} reservations after ${clock(sh.at)}.</b> Hostline won't cancel them. It will stop taking new ones and text you the list.</div></div>
    ${hears(`We're closing early tonight at ${clock(sh.at)}. Can I book you a table for another evening?`,'Callers hear')}
    ${sh.err?`<div class="banner bad"><div class="grow small"><b>Couldn't save.</b> Hostline still says we close at 11:00 pm. Try again.</div></div>`:''}
    <button class="btn pri full" data-a="mclosesave">${sh.err?'Retry':'Close at '+clock(sh.at)}</button></div>`;
  return '';
}

/* ---------- change & input handlers ---------- */
function setPath(path,val){ const ks=path.split('.'); let o=S; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]; if(!o) return; } o[ks[ks.length-1]]=val; }
const C = {
  role(v){ S.role=v; S.scope=defaultScope(v); S.drawer=null; S.pol=null; S.local=null; S.polId=null; S.locId=null; S.bell=false; S.rule=null; S.voiceDraft=null; S.hoursDraft=null;
    if(v!=='gm'&&S.device==='mobile') S.device='desktop';
    if((S.sub==='team'&&!can.team())||(S.sub==='integrations'&&!can.integrations())) S.sub='voice'; },
  scope(v){ S.scope=v; S.locId=null; S.pol=null; S.local=null; S.calls.loc=''; },
  fail(v,el){ S.fail=el.checked; },
  notes(v,el){ S.notes=el.checked; },
  hoursLoc(v){ S.hoursLoc=v; S.hoursDraft=null; },
  'pol.lock'(v){ S.pol.lock=v; },
  'pol.choice'(v){ S.pol.choice=v; },
  'pol.ack'(v,el){ S.pol.ack=el.checked; },
  'm.sheet.linked'(v,el){ S.m.sheet.linked=el.checked; }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) { if(S.bell && !e.target.closest('.popover')){ S.bell=false; render(); } return; }
  if(el.disabled) return;
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault(); fn(el.dataset.v, el, e); render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.m.sheet){S.m.sheet=null;} else if(S.drawer){S.drawer=null;} else if(S.bell){S.bell=false;} else return; render(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-a][tabindex], tr[data-a], .li[data-a], .item[data-a], .p-card[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.name==='reas'||el.name==='res'){ el.closest('.choice').querySelectorAll('label').forEach(l=>l.classList.toggle('on', l.contains(el))); return; }
  const k=el.dataset.c; if(!k) return;
  if(k.startsWith('h-')){ const [,i,f]=k.split('-'); S.hoursDraft[Number(i)][f]=Number(el.value); render(); return; }
  if(C[k]) C[k](el.value, el); else setPath(k, el.value);
  render();
});
document.addEventListener('input',e=>{
  const el=e.target; const k=el.dataset.i; if(!k) return;
  if(k.startsWith('voice.')){ if(!S.voiceDraft) S.voiceDraft={...D.voice[S.voiceBrand]}; S.voiceDraft[k.slice(6)]=el.value; }
  else setPath(k, el.value);
  render();
});

initData(); initState(); render();
})();
</script>
</body>
</html>
