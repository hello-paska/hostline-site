<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostline Wireframe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
/* Single white theme by design (low-fi wireframe). */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F3F4F6; --sunk2:#E9EBEE; --ink:#1C1F23; --ink2:#484E55; --muted:#6A7078;
  --line:#C8CCD1; --faint:#E5E7EA;
  --accent:#2450D3; --accent-soft:#E8EDFB;
  --sticky:#FFF3AE; --sticky-ink:#4A3F00;
  --bad:#B3342A; --bad-soft:#FBEAE8; --warn:#8C6310; --warn-soft:#FBF1DC; --good:#2C6E45; --good-soft:#E3F2E8;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-note:"Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:24px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.sp{justify-content:space-between}

/* prototype controls */
.bar{flex:none;background:var(--sunk);border-bottom:1.5px solid var(--line);padding:8px 16px;display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:13px}
.bar .tag{color:var(--muted)}
.bar-ctl{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.bar select,.bar button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px 8px;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar input[type=checkbox]{accent-color:var(--ink);width:15px;height:15px}

/* viewport: outer box contains overlays and is the size container, inner box scrolls */
.vpo{flex:1;min-height:0;position:relative;contain:layout;container-type:inline-size;container-name:vp;background:var(--bg)}
.vps{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}

/* app shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{border-right:1.5px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;padding:0 6px}
.logo i{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);color:var(--ink2)}
.nav button:hover{background:var(--sunk)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button.on{background:var(--ink);color:#fff;font-weight:700}
.nav .count{font-family:var(--f-mono);font-size:12px;border:1px solid currentColor;border-radius:10px;padding:0 6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 24px;border-bottom:1.5px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px}
.menuwrap{position:relative}
.menubtn{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;border:1.5px solid var(--ink);border-radius:var(--r);padding:6px 10px;font-weight:700;background:var(--surface)}
.menubtn:focus-visible{outline:2px solid var(--accent)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-height:60vh;overflow:auto;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);z-index:30;padding:6px}
.menu.right{left:auto;right:0}
.menu .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 8px 4px}
.menu button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:7px 8px;border-radius:3px}
.menu button:hover,.menu button:focus-visible{background:var(--sunk)}
.menu button.on{font-weight:700}
.menu hr{border:0;border-top:1px solid var(--faint);margin:6px 0}
.iconbtn{all:unset;cursor:pointer;position:relative;width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.iconbtn .badge{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-family:var(--f-mono)}
.bell{width:14px;height:13px;border:1.5px solid var(--ink);border-radius:7px 7px 2px 2px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sunk);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

/* primitives */
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.master{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--bad)}
.kpi.alert .v{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#383D43}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.pri{background:var(--bad);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;line-height:20px;white-space:nowrap;background:var(--surface);color:var(--ink2)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.chip.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line);flex:none;margin-top:7px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.acc{background:var(--accent)}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--sunk)}
.t th button{all:unset;cursor:pointer}
.t td{padding:9px 12px;border-bottom:1px solid var(--faint);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.t td.worst{color:var(--bad);font-weight:700}
.t .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid transparent;margin-bottom:-1.5px;color:var(--ink2)}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:13px;font-weight:700}
.field small{color:var(--muted);font-size:12px}
.field .err{color:var(--bad);font-size:12px}
.input{border:1.5px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--surface);width:100%}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--ink);outline:none}
.input[readonly]{background:var(--sunk);color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;min-width:0}
.filters input.input{flex:1 1 200px}
.choice{display:flex;flex-direction:column;gap:6px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.choice label.on{border-color:var(--ink);background:var(--sunk)}
.choice input{margin-top:3px;accent-color:var(--ink)}
.choice small{display:block;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:18px;padding:5px 12px;font-size:13px}
.pills button.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.pills button:focus-visible{outline:2px solid var(--accent)}
.banner{border:1.5px solid var(--line);border-left-width:5px;border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner .grow{flex:1 1 220px}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner.good{border-color:var(--good);background:var(--good-soft)}
.banner.info{border-color:var(--accent);background:var(--accent-soft)}
.hears{margin:0;border:1.5px dashed var(--ink2);border-radius:14px 14px 14px 3px;padding:10px 14px;background:var(--sunk)}
.hears figcaption{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.hears blockquote{margin:0}
.ph{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border:1.5px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.empty b{font-size:17px}
.empty p{color:var(--muted);max-width:52ch}
.wave{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px}
.wave .bars{flex:1;height:28px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave .bars i{flex:1;background:var(--line);border-radius:1px;min-width:2px}
.wave.playing .bars i{animation:pl 1.2s ease-in-out infinite alternate}
.wave.playing .bars i:nth-child(odd){animation-delay:.3s}
@keyframes pl{to{background:var(--ink)}}
.playbtn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:11px;flex:none}
.transcript{display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:14px}
.tl b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--faint)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--sunk)}
.li.sel{background:var(--accent-soft)}
.li .grow p{font-size:13px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.hbar .track{height:14px;background:var(--sunk);border-radius:2px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink2)}
.hbar .fill.bad{background:var(--bad)}
.hbar .v{text-align:right;font-family:var(--f-mono);font-size:12px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:140px;border-bottom:1.5px solid var(--line);padding-top:10px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vbars i{width:100%;background:var(--line);border-radius:2px 2px 0 0;display:block}
.vbars div:last-child i{background:var(--ink)}
.vbars span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vlabels{display:flex;gap:8px}
.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.progress{height:8px;background:var(--sunk2);border-radius:4px;overflow:hidden;display:flex}
.progress i{display:block;height:100%;background:var(--ink)}
.progress i.pilot{background:var(--ink2);opacity:.55}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:13px;border-left:2px solid var(--faint);padding-left:12px}
.timeline span{color:var(--muted)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.back{align-self:flex-start}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggle input{accent-color:var(--ink);width:16px;height:16px;flex:none}
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--faint)}
.step:last-child{border-bottom:0}
.step .num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.step.done .num{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper div{flex:1 1 90px;border-top:4px solid var(--sunk2);padding-top:6px;font-size:12px;color:var(--muted)}
.stepper div.done{border-color:var(--ink2);color:var(--ink2)}
.stepper div.cur{border-color:var(--ink);color:var(--ink);font-weight:700}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:12px 0}
.success .ok{width:44px;height:44px;border-radius:50%;border:2px solid var(--good);color:var(--good);display:grid;place-items:center;font-size:20px;font-weight:700}
.success p{color:var(--ink2);max-width:46ch}

/* design notes */
.note{font-family:var(--f-note);background:var(--sticky);color:var(--sticky-ink);padding:8px 12px;border-radius:2px;font-size:15px;line-height:1.35;transform:rotate(-.4deg);box-shadow:1px 2px 0 rgba(0,0,0,.07);max-width:62ch}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(28,31,35,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1.5px solid var(--ink);z-index:21;display:flex;flex-direction:column}
.dhead{padding:14px 18px;border-bottom:1.5px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;z-index:23;display:flex;flex-direction:column}
.modal.wide{width:min(720px,calc(100% - 32px))}
.mscrim{position:fixed;inset:0;background:rgba(28,31,35,.4);z-index:22}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1.5px solid var(--line)}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mbody.busy{opacity:.55;pointer-events:none}
.mfoot{padding:12px 18px;border-top:1.5px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r);font-size:18px;flex:none}
.x:hover{background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:40;width:max-content;max-width:calc(100% - 32px);flex-wrap:wrap;font-size:14px}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* onboarding, auth and focused flows */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:18px;background:var(--sunk)}
.authcard{width:min(460px,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px}
.authcard.wide{width:min(900px,100%)}
.mail{width:min(620px,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.mail-head{padding:14px 18px;border-bottom:1px solid var(--faint);font-size:13px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px}
.mail-body{padding:24px 18px;display:flex;flex-direction:column;gap:14px}

@container vp (max-width:1000px){
  .master,.grid3{grid-template-columns:minmax(0,1fr)}
  .master .hide-narrow{display:none}
}
@container vp (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1.5px solid var(--line);padding:8px 12px;gap:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .side-foot,.logo{display:none}
  .content{padding:16px}
  .topbar{padding:10px 16px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .who-name{display:none}
}
@container vp (max-width:560px){
  .modal,.modal.wide{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:14px 14px 0 0;border-width:1.5px 0 0}
  .mfoot .btn{flex:1}
  .authcard{padding:18px}
  .scope-label{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.note{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Hostline low-fi prototype, admin-only scope, structured by "Hostline MVP — IA map (admin only)".
   All data is sample data for the fictional Harbor & Hearth Group. */
(function(){
"use strict";

/* ---------- constants ---------- */
const NOW = 19*60+40; // Fri Sep 25, 7:40 pm

const dur = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

/* =========================================================
   POPUPS: each has a form, then loading → success or error
   ========================================================= */
function renderModal(){
  const m=S.modal; if(!m) return ''; const def=MODALS[m.type], v=m.state==='success'?{title:m.title, wide:m.wide}:def.view(m);
  let body=v.body, foot;
  if(m.state==='success'){
    body=`<div class="success" role="status"><span class="ok">✓</span><h2>${esc(m.done.title)}</h2>${m.done.text?`<p>${esc(m.done.text)}</p>`:''}</div>${m.done.extra||''}`;
    foot=`${m.done.next?`<button class="btn" data-a="${m.done.next.a}" data-v="${esc(m.done.next.v||'')}">${esc(m.done.next.label)}</button>`:''}<button class="btn pri" data-a="mclose">Done</button>`;
  } else {
    if(m.state==='error') body=`<div class="banner bad" role="alert"><div class="grow small"><b>${esc(v.errTitle||'Couldn\'t save.')}</b> ${esc(v.err||'Nothing changed. Try again.')}</div></div>`+body;
    foot=`<button class="btn" data-a="mclose">${v.cancel||'Cancel'}</button><button class="btn pri ${v.danger?'danger':''}" data-a="submit" ${v.disabled||m.state==='loading'?'disabled':''}>${m.state==='loading'?`<span class="spin"></span> ${esc(v.busy||'Saving…')}`:m.state==='error'?'Try again':esc(v.primary)}</button>`;
  }
  return `<div class="mscrim" data-a="mclose"></div><div class="modal ${v.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mtitle" aria-busy="${m.state==='loading'}"><div class="mhead"><h2 id="mtitle">${v.title}</h2><button class="x" data-a="mclose" aria-label="Close">✕</button></div><div class="mbody ${m.state==='loading'?'busy':''}" data-keep="modal">${body}</div><div class="mfoot">${foot}</div></div>`;
}
const choice = (name,dc,opts,cur) => `<div class="choice">${opts.map(o=>{ const [val,label,sub]=Array.isArray(o)?o:[o,o,'']; return `<label class="${cur===val?'on':''}"><input type="radio" name="${name}" data-c="${dc}" value="${esc(val)}" ${cur===val?'checked':''}><span>${esc(label)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`; }).join('')}</div>`;
const locSelect = (m,key,locs) => `<label class="field"><span>Location</span><select class="input" id="m-${key}" data-c="modal.${key}">${locs.map(l=>`<option value="${l.id}" ${m[key]===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>`;
const loopCheck = num => { const d=(num||'').replace(/\D/g,''); return !!d && LOCS.some(x=>x.line.replace(/\D/g,'')===d); };

const MODALS={
  editloc:{ view(m){ return {title:`Edit location · ${esc(m.orig)}`, primary:'Save', disabled:!m.name.trim(), err:'The location wasn\'t updated. Try again.', body:`
      <label class="field"><span>Name</span><input class="input" id="m-name" data-i="modal.name" value="${esc(m.name)}"></label>
      <div class="grid2"><label class="field"><span>Brand</span><select class="input" id="m-brand" data-c="modal.brand">${Object.entries(BRANDS).map(([k,b])=>`<option value="${k}" ${m.brand===k?'selected':''}>${b.name}</option>`).join('')}</select></label>
      <label class="field"><span>Region</span><select class="input" id="m-region" data-c="modal.region">${Object.entries(REGIONS).map(([k,r])=>`<option value="${k}" ${m.region===k?'selected':''}>${r.name}</option>`).join('')}</select></label></div>
      <label class="field"><span>Address</span><input class="input" id="m-addr" data-i="modal.addr" value="${esc(m.addr)}"></label>
      <div class="grid2"><label class="field"><span>General Manager</span><input class="input" id="m-gm" data-i="modal.gm" value="${esc(m.gm)}"><small>Gets this location's follow-ups by SMS</small></label>
      <label class="field"><span>Existing phone number</span><input class="input mono" id="m-main" data-i="modal.main" value="${esc(m.main)}"></label></div>`}; },
    apply(m){ const l=L[m.id]; Object.assign(l,{name:m.name.trim(), brand:m.brand, region:m.region, addr:m.addr, gm:m.gm, main:m.main}); addLog('Location details updated', l.name, m.orig, l.name); return {title:'Location saved', text:`${l.name} · ${BRANDS[l.brand].name} · ${REGIONS[l.region].name} region · GM ${l.gm}`}; } },
  sample:{ view(m){ const v=S.voiceDraft||D.voice[S.voiceBrand]; return {title:`Listen to sample · ${BRANDS[S.voiceBrand].name}`, primary:'Generate sample', busy:'Generating…', errTitle:'Couldn\'t generate the sample.', err:'The voice service didn\'t respond. Try again.', cancel:'Close', body:`
      <dl class="dl"><dt>Voice</dt><dd>${v.voice}</dd><dt>Tone</dt><dd>${v.tone}</dd><dt>Pace</dt><dd>${v.pace}</dd></dl>
      <label class="field"><span>Sample location</span><select class="input" id="m-sl" data-c="modal.loc">${LOCS.filter(l=>l.brand===S.voiceBrand).map(l=>`<option value="${l.id}" ${m.loc===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
      ${hears(v.greeting.replace('{location}',L[m.loc].name),'Sample script')}`}; },
    apply(m){ const v=S.voiceDraft||D.voice[S.voiceBrand]; S.playing='sample'; return {title:'Sample ready', text:`${v.voice}, ${v.tone.toLowerCase()} tone, ${v.pace.toLowerCase()} pace`, extra:`${player('sample')}${hears(v.greeting.replace('{location}',L[m.loc].name),'Playing')}`}; } },
  invite:{ view(m){ const ok=/.+@.+\..+/.test(m.email||''); return {title:'Invite member', primary:'Send invite', busy:'Sending…', disabled:!ok, err:'The invite wasn\'t sent. Check the address and try again.', body:`
      <label class="field"><span>Work email</span><input class="input" type="email" id="m-email" data-i="modal.email" value="${esc(m.email||'')}" placeholder="name@harborhearth.com">${m.email&&!ok?'<span class="err">Enter a full email address.</span>':''}</label>
      <div class="field"><span>Role</span>${choice('ir','modal.role',[['Admin','Admin','Can change everything, launch restaurants and invite people'],['Read-only','Read-only','Sees calls, follow-ups and reports; can\'t change anything']],m.role)}</div>
      <p class="small muted">They get an email to create their account. The link expires in 7 days.</p>`}; },
    apply(m){ D.team.push({name:m.email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), email:m.email, role:m.role, status:'Invited'}); return {title:'Invite sent', text:`${m.email} will get an email to join Harbor & Hearth Group as ${m.role}.`}; } },
  role:{ view(m){ const t=D.team[m.i]; return {title:`Change role · ${esc(t.name)}`, primary:'Change role', disabled:m.role===t.role, err:'The role didn\'t change. Try again.', body:choice('rl','modal.role',[['Admin','Admin','Can change everything'],['Read-only','Read-only','Can view everything, change nothing']],m.role)}; },
    apply(m){ const t=D.team[m.i]; t.role=m.role; return {title:'Role changed', text:`${t.name} is now ${m.role}. It applies the next time they load a page.`}; } },
  remove:{ view(m){ const t=D.team[m.i]; return {title:`Remove ${esc(t.name)}?`, primary:'Remove member', danger:true, busy:'Removing…', err:'They still have access. Try again.', body:`<p>${esc(t.name)} loses access to Hostline right away. Their changes stay in the change log.</p>`}; },
    apply(m){ const t=D.team.splice(m.i,1)[0]; return {title:'Member removed', text:`${t.name} no longer has access.`}; } },
  rule:{ view(m){ const line=m.id.startsWith('line:'), xfer=m.then==='Transfer', showNum=line||(xfer&&m.dest!=='Location manager line'&&m.dest!=='GM'), loop=showNum&&loopCheck(m.num);
      return {title:m.id==='new'?'Add escalation rule':line?`Manager line · ${esc(L[m.id.slice(5)].name)}`:'Edit escalation rule', primary:'Save rule', disabled:loop||(showNum&&!m.num.replace(/\D/g,''))||!m.when.trim(), err:'The rule wasn\'t saved. The old rule still applies.', body:`
      ${line?'<p class="small muted">Hostline transfers here when a caller at this location asks for a manager or reports an allergic reaction.</p>':`<label class="field"><span>When</span><input class="input" id="m-when" data-i="modal.when" value="${esc(m.when)}" placeholder="e.g. Caller asks about lost property"></label>
      <div class="grid2"><label class="field"><span>Then</span><select class="input" id="m-then" data-c="modal.then">${['Transfer','Create follow-up','Create follow-up + SMS'].map(o=>`<option ${m.then===o?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="field"><span>Destination</span><select class="input" id="m-dest" data-c="modal.dest">${['Location manager line','Events manager','Guest Experience','GM','Phone number'].map(o=>`<option ${m.dest===o?'selected':''}>${o}</option>`).join('')}</select></label></div>`}
      ${showNum?`<label class="field"><span>${line?'Manager line':'Transfer number'}</span><input class="input mono" id="m-num" data-i="modal.num" value="${esc(m.num)}" placeholder="(617) 555-0000"></label>`:''}
      ${loop?`<div class="banner bad"><div class="grow small"><b>This would create a loop.</b> ${esc(m.num)} is a Hostline line, so transferred calls come straight back to Hostline. Use a direct or mobile number.</div></div>`:''}
      ${line?'':`<label class="field"><span>Applies to</span><select class="input" id="m-scope" data-c="modal.scope">${['All locations','Harbor Kitchen','Hearth Pizza'].map(o=>`<option ${m.scope===o?'selected':''}>${o}</option>`).join('')}</select></label>`}`}; },
    apply(m){ if(m.id.startsWith('line:')){ const id=m.id.slice(5), old=D.phones[id].transfer; D.phones[id].transfer=m.num; D.phones[id].tested=false; addLog('Routing: manager line', L[id].name, old, m.num); return {title:'Manager line saved', text:`Transfers at ${L[id].name} now go to ${m.num}.`, next:{label:'Test transfer', a:'modal', v:'xfer|'+id}}; }
      const showNum=m.then==='Transfer'&&m.dest!=='Location manager line'&&m.dest!=='GM';
      const r={id:m.id==='new'?'R'+(D.rules.length+1):m.id, when:m.when.trim(), then:m.then, dest:m.dest, num:showNum?m.num:'', scope:m.scope};
      const i=D.rules.findIndex(x=>x.id===r.id); if(i>=0) D.rules[i]=r; else D.rules.push(r); addLog('Routing: rule '+(i>=0?'edited':'added'), r.scope, '—', r.when); return {title:'Rule saved', text:'It applies from the next call.'}; } },
  xfer:{ view(m){ const l=L[m.loc], num=D.phones[m.loc].transfer; return {title:`Test transfer · ${esc(l.name)}`, primary:'Place test transfer', busy:'Calling…', errTitle:m.noAnswer?'No answer after 30 seconds.':'The test didn\'t run.', err:m.noAnswer?`Nobody picked up ${num}. Real callers would get a follow-up instead. Check the number with ${l.gm}, or change it.`:'The call couldn\'t be placed. Try again.', cancel:'Close', body:`
      <p>Hostline calls <b class="mono">${esc(num)}</b> and plays: “Test transfer from Hostline for ${esc(l.name)}. Press 1 to confirm.”</p><p class="small muted">Someone at the restaurant needs to pick up. The call lasts about 20 seconds.</p>`}; },
    fails(m){ m.noAnswer=D.phones[m.loc].transfer==='(617) 555-0199'; return m.noAnswer||S.fail; },

  resolve:{ view(m){ const f=fuById(m.fu), opts=[...RESOLVE[f.type],'No answer, try again later']; return {title:`Resolve ${f.id}`, primary:m.outcome&&m.outcome.startsWith('No answer')?'Log attempt':'Resolve', disabled:!m.outcome, err:'The follow-up is still open. Try again.', body:`

  impact:{ view(m){
      const p=D.policies.find(x=>x.id===m.pol), locs=polLocs(p), ovIds=Object.keys(p.ov), names=ovIds.map(id=>L[id].name), nv=p.kind==='number'?Number(S.polDraft.v):S.polDraft.v, forced=m.lock==='locked';

    apply(m){ const p=D.policies.find(x=>x.id===m.pol), old=fmtVal(p,p.value), nv=p.kind==='number'?Number(S.polDraft.v):S.polDraft.v;

  soldout:{ view(m){ const it=D.menu.find(x=>x.id===m.item), l=L[m.loc], linked=(it.linked||[]).map(id=>D.menu.find(x=>x.id===id)), locs=scopeLocs().filter(x=>x.brand===it.brand);

      return {title:`${L[m.loc].name} is live`, text:`Hostline answers every call. ${liveCount()} of 18 locations live.`}; } }
};

function goPage(p){ S.page=p; S.drawer=null; S.locId=null; S.polDraft=null; S.local=null; S.err=null; scrollTop(); }

const A={

  notifs(){ S.drawer={kind:'notifs'}; },

  closedrawer(){ S.drawer=null; S.playing=null; },
  call(v){ S.drawer={kind:'call', id:v}; },
  play(v){ S.playing=S.playing===v?null:v; },
  openfu(v){ goPage('followups'); const f=fuById(v); S.fu.tab=f&&!isOpen(f)?'closed':'open'; S.fu.type=''; S.fu.sel=v; },

  ktab(v){ S.modal=null; if(S.page!=='knowledge'||S.screen!=='app'){ S.screen='app'; goPage('knowledge'); } S.ktab=v; S.polDraft=null; S.local=null; S.err=null; },
  brand(v){ S.brand=v; S.polId=null; },
  loc(v){ goPage('locations'); S.locId=v; S.locTab='overview'; },
  locback(){ S.locId=null; },
  loctab(v){ S.locTab=v; },
  lfilter(v){ S.lfilter=v; },
  sort(v){ if(S.sort.k===v) S.sort.d*=-1; else S.sort={k:v,d:['name','status','answer','ai','calls'].includes(v)?1:-1}; },
  repperiod(v){ S.rep.period=v; },
  stab(v){ S.stab=v; S.profileDraft=null; S.err=null; },
  gosettings(v){ goPage('settings'); S.stab=v; },

  toastx(){ S.toast=null; },
  reset(){ const n=S.notes, mode=D.ws; initData(mode); initState(); S.notes=n; if(mode==='new') S.screen='invite'; toast('Sample data reset.'); },
  modal(v){
    const i=v.indexOf('|'), type=i<0?v:v.slice(0,i), arg=i<0?'':v.slice(i+1), m={type, state:'form'};
    S.toast=null;
    if(['resolve','reassign','closefu'].includes(type)){ const f=fuById(S.fu.sel); m.fu=f.id; m.note=''; if(type==='resolve'){ m.outcome=null; m.answer=f.loc==='pier21'?'Yes, we have a kids\' brunch menu on Sundays from 10 am to 2 pm.':'Yes, we offer vegan mozzarella on any pizza for $2.'; } }
    if(type==='editloc'){ const l=L[arg]; Object.assign(m,{id:l.id, orig:l.name, name:l.name, brand:l.brand, region:l.region, addr:l.addr, gm:l.gm, main:l.main}); }
    if(type==='sample') m.loc=LOCS.find(l=>l.brand===S.voiceBrand).id;
    if(type==='invite') Object.assign(m,{email:'', role:'Admin'});
    if(type==='role'||type==='remove'){ m.i=Number(arg); m.role=D.team[m.i].role; }
    if(type==='rule'){ if(arg==='new') Object.assign(m,{id:'new', when:'', then:'Transfer', dest:'Phone number', num:'', scope:'All locations'});
      else if(arg.startsWith('line:')) Object.assign(m,{id:arg, when:'Caller asks for a manager', then:'Transfer', dest:'Location manager line', num:D.phones[arg.slice(5)].transfer, scope:L[arg.slice(5)].name});
      else { const r=D.rules.find(x=>x.id===arg); Object.assign(m,{id:r.id, when:r.when, then:r.then, dest:r.dest, num:r.num, scope:r.scope}); } }
    if(type==='xfer') m.loc=arg;
    if(type==='integr') m.id=arg;
    if(type==='impact') Object.assign(m,{pol:S.polId, lock:D.policies.find(x=>x.id===S.polId).lock, choice:'keep', per:{}, ack:false, ruleFixed:false});
    if(type==='avail'||type==='itemnote'){ m.item=arg; m.loc=S.kLoc; m.note=(D.menu.find(x=>x.id===arg).note)||''; }
    if(type==='closeslot') Object.assign(m,{loc:S.kLoc||scopeLocs()[0].id, date:'Sat Oct 3', slot:'All day', reason:''});
    if(type==='reopen'){ m.i=Number(arg); m.loc=S.kLoc; }
    if(type==='hours'){ m.loc=S.kLoc; m.h=JSON.parse(JSON.stringify(D.hours[S.kLoc])); }
    if(type==='event'){ const sl=scopeLoc(); Object.assign(m,{name:'', date:'Sat Oct 31', time:'5:00 pm – 10:00 pm', where:sl?sl.id:'all:hk', resv:'Open', hears:''}); }
    if(type==='export') m.secs=[true,true,true,true,true,true,false];
    if(type==='pilot'){ m.loc=arg; m.notify=true; }
    if(type==='golive'){ m.loc=arg; m.fwd=false; }
    S.modal=m;
  },

  perloc(v){ const [id,c]=v.split('|'); S.modal.per[id]=c; },

  dlcsv(){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([S.modal.csv],{type:'text/csv'})); a.download=`hostline-report-${S.rep.period}.csv`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} toast('Download started. If nothing happens, use Copy.'); },
  poledit(){ const p=D.policies.find(x=>x.id===S.polId); S.polDraft={id:p.id, v:p.id==='P1'?10:p.value}; },

  localx(){ S.local=null; S.err=null; },

    run('local', ()=>{ const prev=p.ov[l.id]; p.ov[l.id]={v, by:ME.name, days:0}; addLog(`Policy override: ${p.name}`, l.name, prev?fmtVal(p,prev.v):fmtVal(p,p.value), fmtVal(p,v)); S.local=null; }, `Saved. Live on the next call at ${l.name}.`); },

  resvsave(){ const Dr=S.resvDraft; run('resv', ()=>{ const R=D.resv[Dr.loc]; addLog('Reservation rules', L[Dr.loc].name, `max ${R.max}, ${R.window} days, ${R.dur} min`, `max ${Dr.max}, ${Dr.window} days, ${Dr.dur} min`); Object.assign(R,{max:Number(Dr.max), window:Number(Dr.window), dur:Number(Dr.dur)}); S.resvDraft=null; }, 'Booking rules saved. Live on the next call.'); },
  resvx(){ S.resvDraft=null; S.err=null; },
  voicebrand(v){ S.voiceBrand=v; S.voiceDraft=null; S.err=null; },
  voiceset(v){ const [k,val]=v.split('|'); if(!S.voiceDraft) S.voiceDraft={...D.voice[S.voiceBrand]}; S.voiceDraft[k]=val; },
  voicex(){ S.voiceDraft=null; S.err=null; },
  voicesave(){ const b=S.voiceBrand; run('voice', ()=>{ const prev=D.voice[b]; D.voice[b]=S.voiceDraft; S.voiceDraft=null; addLog('Voice & greeting updated', `${BRANDS[b].name} (${LOCS.filter(l=>l.brand===b).length} locations)`, `${prev.voice} · ${prev.tone}`, `${D.voice[b].voice} · ${D.voice[b].tone}`); }, `Live on the next call at every ${BRANDS[b].name} location.`); },
  profilesave(){ run('profile', ()=>{ D.prefs=S.profileDraft.prefs; S.profileDraft=null; }, 'Profile and notification settings saved.'); },
  profilex(){ S.profileDraft=null; S.err=null; },
  pwreset(){ toast(`We sent a password reset link to ${ME.email}.`); },
  scr(v){ S.screen=v; S.auth.err=null; S.err=null; scrollTop(); },
  createaccount(){ run('signup', ()=>{ S.screen='setup'; S.setupStep=null; scrollTop(); }); },
  setupstep(v){ S.setupStep=v||null; S.err=null; S.voiceDraft=null; scrollTop(); },
  setupdone(v){ run('setup-'+v, ()=>{ if(v==='voice'&&S.voiceDraft){ const b=S.voiceBrand; D.voice[b]=S.voiceDraft; S.voiceDraft=null; addLog('Voice & greeting updated', BRANDS[b].name, '—', D.voice[b].voice+' · '+D.voice[b].tone); } D.setup[v]=true; const next=SSTEPS.find(s=>!D.setup[s[0]]); S.setupStep=next?next[0]:null; scrollTop(); }, 'Step saved.'); },
  setupexit(){ S.screen='app'; goPage('overview'); },
  setupfinish(){ S.screen='app'; goPage('locations'); S.lfilter='all'; toast('Workspace is set up. Launch your first restaurant.'); },
  launch(v){ const l=L[v], x=D.launch[v], first=LSTEPS.findIndex(([k])=>!x.steps[k]);
    S.lw={loc:v, step:first<0?3:first, hours:JSON.parse(JSON.stringify(D.hours[v])), off:{}, resv:{max:D.resv[v].max, window:D.resv[v].window, dur:D.resv[v].dur}, test:false, ok:false};
    D.menu.filter(m=>m.brand===l.brand).forEach(it=>{ const a=D.avail[v+':'+it.id]; if(a&&a.until==='manual') S.lw.off[it.id]=true; });
    S.screen='launch'; S.drawer=null; S.err=null; scrollTop(); },
  lwnext(){ const w=S.lw, k=LSTEPS[w.step][0], x=D.launch[w.loc];
    run('lw-'+k, ()=>{
      if(k==='hours') D.hours[w.loc]=JSON.parse(JSON.stringify(w.hours));
      if(k==='menu') D.menu.filter(m=>m.brand===L[w.loc].brand).forEach(it=>{ const key=w.loc+':'+it.id; if(w.off[it.id]) D.avail[key]={until:'manual', by:ME.name, at:NOW}; else if(D.avail[key]&&D.avail[key].until==='manual') delete D.avail[key]; });
      if(k==='resv') Object.assign(D.resv[w.loc],{max:Number(w.resv.max), window:Number(w.resv.window), dur:Number(w.resv.dur)});
      x.steps[k]=true; addLog(`Launch: ${LSTEPS[w.step][1].toLowerCase()} confirmed`, L[w.loc].name, '—', `${stepsDone(w.loc)} of 4 steps`); w.step++; scrollTop(); }); },
  lwback(){ S.lw.step--; S.err=null; scrollTop(); },
  lwexit(){ const id=S.lw.loc; S.screen='app'; goPage('locations'); S.locId=id; S.lw=null; toast('Progress saved.'); },
  lwtest(){ S.lw.test=true; S.playing='lwtest'; },
  login(){ const a=S.auth; if(!a.email||!a.pw){ a.err='Enter your email and password.'; return; } a.err=null; S.busy='login'; render(); setTimeout(()=>{ S.busy=null; if(S.fail) a.err='That email and password don\'t match. Try again or reset your password.'; else { S.screen='app'; goPage('overview'); } render(); }, 650); },
  sendreset(){ if(!/.+@.+\..+/.test(S.auth.email)){ S.auth.err='Enter your full work email.'; return; } S.auth.err=null; S.busy='reset'; render(); setTimeout(()=>{ S.busy=null; if(S.fail) S.auth.err='We couldn\'t send the email. Try again in a minute.'; else S.screen='resetSent'; render(); }, 650); }
};

/* ---------- change & input ---------- */
function setPath(path,val){ const ks=path.split('.'); let o=S; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]; if(o==null) return; } o[ks[ks.length-1]]=val; }
const C={
  start(v){ S.modal=null; S.drawer=null; S.menu=null; S.toast=null; S.err=null;
    if(v==='login'){ S.screen='login'; S.auth={email:ME.email, pw:'', err:null}; return; }
    const n=S.notes, f=S.fail; initData(v==='new'?'new':'active'); initState(); S.notes=n; S.fail=f;
    if(v==='new') S.screen='invite'; },
  fail(v,el){ S.fail=el.checked; },
  notes(v,el){ S.notes=el.checked; },
  kLoc(v){ S.kLoc=v; S.resvDraft=null; S.err=null; },
  quiet(v,el){ S.profileDraft=profileData(); S.profileDraft.quiet=el.checked; },
  lwok(v,el){ S.lw.ok=el.checked; },
  'modal.linked'(v,el){ S.modal.linked=el.checked; },
  'modal.ack'(v,el){ S.modal.ack=el.checked; },
  'modal.fwd'(v,el){ S.modal.fwd=el.checked; },
  'modal.notify'(v,el){ S.modal.notify=el.checked; }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){ if(S.menu&&!e.target.closest('.menu')){ S.menu=null; render(); } return; }
  if(el.disabled) return;
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault(); if(el.dataset.a!=='menu') S.menu=null;
  fn(el.dataset.v||'', el, e); render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.menu) S.menu=null; else if(S.modal&&S.modal.state!=='loading') S.modal=null; else if(S.drawer) S.drawer=null; else return; render(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-a], .li[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset.c; if(!k) return;
  const p=k.split('|');
  if(p[0]==='h') S.modal.h[Number(p[1])][p[2]]=Number(el.value);
  else if(p[0]==='lwh') S.lw.hours[Number(p[1])][p[2]]=Number(el.value);
  else if(p[0]==='lwmenu') S.lw.off[p[1]]=!el.checked;
  else if(p[0]==='exsec') S.modal.secs[Number(p[1])]=el.checked;
  else if(p[0]==='pref'){ S.profileDraft=profileData(); S.profileDraft.prefs[p[1]][p[2]]=el.checked; }
  else if(p[0]==='lock'){ const pol=D.policies.find(x=>x.id===p[1]), old=LOCK[pol.lock][0]; pol.lock=el.value; addLog(`Policy lock: ${pol.name}`, BRANDS[pol.brand].name, old, LOCK[pol.lock][0]); toast(`${pol.name}: ${LOCK[pol.lock][0]}.`); }
  else if(C[k]) C[k](el.value, el);
  else setPath(k, el.value);
  render();
});
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset.i; if(!k) return;
  if(k.startsWith('profileDraft.')) S.profileDraft=profileData();
  if(k.startsWith('voiceDraft.')&&!S.voiceDraft) S.voiceDraft={...D.voice[S.voiceBrand]};
  if(k.startsWith('resvDraft.')&&(!S.resvDraft||S.resvDraft.loc!==S.kLoc)){ const R=D.resv[S.kLoc]; S.resvDraft={loc:S.kLoc, max:R.max, window:R.window, dur:R.dur}; }
  setPath(k, el.value); render();
});

initData('active'); initState(); render();
})();
</script>
</body>
