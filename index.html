<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostline Wireframe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
/* Single white theme by design (low-fi wireframe). */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F3F4F6; --sunk2:#E9EBEE; --ink:#1C1F23; --ink2:#484E55; --muted:#6A7078;
  --line:#C8CCD1; --faint:#E5E7EA;
  --accent:#2450D3; --accent-soft:#E8EDFB;
  --sticky:#FFF3AE; --sticky-ink:#4A3F00;
  --bad:#B3342A; --bad-soft:#FBEAE8; --warn:#8C6310; --warn-soft:#FBF1DC; --good:#2C6E45; --good-soft:#E3F2E8;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-note:"Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:24px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.sp{justify-content:space-between}

/* prototype controls */
.bar{flex:none;background:var(--sunk);border-bottom:1.5px solid var(--line);padding:8px 16px;display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:13px}
.bar .tag{color:var(--muted)}
.bar-ctl{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.bar select,.bar button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px 8px;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar input[type=checkbox]{accent-color:var(--ink);width:15px;height:15px}

/* viewport: outer box is the containing block + size container, inner box scrolls */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.stage.framed{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;align-content:flex-start;gap:28px;overflow:auto;padding:24px 16px;background:var(--sunk)}
.vpo{flex:1;min-height:0;position:relative;contain:layout;container-type:inline-size;container-name:vp;background:var(--bg);width:100%}
.framed .vpo{flex:none;width:390px;max-width:100%;height:780px;border:10px solid var(--ink);border-radius:36px;overflow:hidden}
.vps{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.frame-notes{display:flex;flex-direction:column;gap:14px;max-width:320px}

/* app shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{border-right:1.5px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;padding:0 6px}
.logo i{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);color:var(--ink2)}
.nav button:hover{background:var(--sunk)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button.on{background:var(--ink);color:#fff;font-weight:700}
.nav .count{font-family:var(--f-mono);font-size:12px;border:1px solid currentColor;border-radius:10px;padding:0 6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 24px;border-bottom:1.5px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px}
.menuwrap{position:relative}
.menubtn{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;border:1.5px solid var(--ink);border-radius:var(--r);padding:6px 10px;font-weight:700;background:var(--surface)}
.menubtn[disabled]{cursor:default;border-color:var(--line)}
.menubtn:focus-visible{outline:2px solid var(--accent)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-height:60vh;overflow:auto;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);z-index:30;padding:6px}
.menu.right{left:auto;right:0}
.menu .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 8px 4px}
.menu button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:7px 8px;border-radius:3px}
.menu button:hover,.menu button:focus-visible{background:var(--sunk)}
.menu button.on{font-weight:700}
.menu hr{border:0;border-top:1px solid var(--faint);margin:6px 0}
.iconbtn{all:unset;cursor:pointer;position:relative;width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.iconbtn .badge{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-family:var(--f-mono)}
.bell{width:14px;height:13px;border:1.5px solid var(--ink);border-radius:7px 7px 2px 2px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sunk);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

/* primitives */
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.master{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--bad)}
.kpi.alert .v{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#383D43}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.pri{background:var(--bad);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;line-height:20px;white-space:nowrap;background:var(--surface);color:var(--ink2)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.chip.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line);flex:none;margin-top:7px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.acc{background:var(--accent)}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--sunk)}
.t th button{all:unset;cursor:pointer}
.t td{padding:9px 12px;border-bottom:1px solid var(--faint);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--sunk)}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.t td.worst{color:var(--bad);font-weight:700}
.t .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid transparent;margin-bottom:-1.5px;color:var(--ink2)}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:13px;font-weight:700}
.field small{color:var(--muted);font-size:12px}
.field .err{color:var(--bad);font-size:12px}
.input{border:1.5px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--surface);width:100%}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--ink);outline:none}
.input[readonly]{background:var(--sunk);color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;min-width:0}
.filters input.input{flex:1 1 200px}
.choice{display:flex;flex-direction:column;gap:6px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer}
.choice label.on{border-color:var(--ink);background:var(--sunk)}
.choice input{margin-top:3px;accent-color:var(--ink)}
.choice small{display:block;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:18px;padding:5px 12px;font-size:13px}
.pills button.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.pills button:focus-visible{outline:2px solid var(--accent)}
.banner{border:1.5px solid var(--line);border-left-width:5px;border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner .grow{flex:1 1 220px}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner.good{border-color:var(--good);background:var(--good-soft)}
.banner.info{border-color:var(--accent);background:var(--accent-soft)}
.hears{margin:0;border:1.5px dashed var(--ink2);border-radius:14px 14px 14px 3px;padding:10px 14px;background:var(--sunk)}
.hears figcaption{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.hears blockquote{margin:0}
.ph{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border:1.5px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.wave{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px}
.wave .bars{flex:1;height:28px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave .bars i{flex:1;background:var(--line);border-radius:1px;min-width:2px}
.wave.playing .bars i{animation:pl 1.2s ease-in-out infinite alternate}
.wave.playing .bars i:nth-child(odd){animation-delay:.3s}
@keyframes pl{to{background:var(--ink)}}
.playbtn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:11px;flex:none}
.transcript{display:flex;flex-direction:column;gap:8px}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:14px}
.tl b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--faint)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--sunk)}
.li.sel{background:var(--accent-soft)}
.li .grow p{font-size:13px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.hbar .track{height:14px;background:var(--sunk);border-radius:2px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink2)}
.hbar .fill.bad{background:var(--bad)}
.hbar .v{text-align:right;font-family:var(--f-mono);font-size:12px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:140px;border-bottom:1.5px solid var(--line);padding-top:10px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vbars i{width:100%;background:var(--line);border-radius:2px 2px 0 0;display:block}
.vbars div:last-child i{background:var(--ink)}
.vbars span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vlabels{display:flex;gap:8px}
.vlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.progress{height:8px;background:var(--sunk2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink)}
.timeline{display:flex;flex-direction:column;gap:6px;font-size:13px;border-left:2px solid var(--faint);padding-left:12px}
.timeline span{color:var(--muted)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa button{all:unset;cursor:pointer;border:1.5px solid var(--ink);border-radius:8px;padding:14px 8px;text-align:center;font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.qa button i{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--ink2);flex:none}
.qa button small{font-weight:400;color:var(--muted);font-size:12px}
.qa button:hover{background:var(--sunk)}
.qa button:focus-visible{outline:2px solid var(--accent)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);animation:pu 2s infinite;flex:none}
@keyframes pu{50%{opacity:.35}}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--faint);cursor:pointer}
.item:hover{background:var(--sunk)}
.back{align-self:flex-start}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggle input{accent-color:var(--ink);width:16px;height:16px;flex:none}

/* design notes */
.note{font-family:var(--f-note);background:var(--sticky);color:var(--sticky-ink);padding:8px 12px;border-radius:2px;font-size:15px;line-height:1.35;transform:rotate(-.4deg);box-shadow:1px 2px 0 rgba(0,0,0,.07);max-width:62ch}
.note.r{transform:rotate(.5deg)}

/* overlays (positioned against .vpo) */
.scrim{position:fixed;inset:0;background:rgba(28,31,35,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1.5px solid var(--ink);z-index:21;display:flex;flex-direction:column}
.dhead{padding:14px 18px;border-bottom:1.5px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;z-index:23;display:flex;flex-direction:column}
.modal.wide{width:min(720px,calc(100% - 32px))}
.mscrim{position:fixed;inset:0;background:rgba(28,31,35,.4);z-index:22}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1.5px solid var(--line)}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mfoot{padding:12px 18px;border-top:1.5px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r);font-size:18px;flex:none}
.x:hover{background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:40;width:max-content;max-width:calc(100% - 32px);flex-wrap:wrap;font-size:14px}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* onboarding & access */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:18px;background:var(--sunk)}
.authcard{width:min(460px,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px}
.authcard.wide{width:min(760px,100%)}
.mail{width:min(620px,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.mail-head{padding:14px 18px;border-bottom:1px solid var(--faint);font-size:13px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px}
.mail-body{padding:24px 18px;display:flex;flex-direction:column;gap:14px}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper div{flex:1 1 110px;border-top:4px solid var(--sunk2);padding-top:6px;font-size:12px;color:var(--muted)}
.stepper div.done{border-color:var(--ink2);color:var(--ink2)}
.stepper div.cur{border-color:var(--ink);color:var(--ink);font-weight:700}

/* responsive by container, so the phone frame and real phones behave the same */
@container vp (max-width:1000px){
  .master{grid-template-columns:minmax(0,1fr)}
  .master .hide-narrow{display:none}
}
@container vp (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1.5px solid var(--line);padding:8px 12px;gap:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .side-foot,.logo{display:none}
  .content{padding:16px}
  .topbar{padding:10px 16px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .who-name{display:none}
  .qa{grid-template-columns:minmax(0,1fr)}
  .qa button{flex-direction:row;justify-content:flex-start;padding:12px 14px;text-align:left}
}
@container vp (max-width:560px){
  .modal,.modal.wide{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:14px 14px 0 0;border-width:1.5px 0 0}
  .mfoot .btn{flex:1}
  .authcard{padding:18px}
  .scope-label{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.note{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const polLocs = p => LOCS.filter(l=>l.brand===p.brand);
function effective(p,id){ const o=p.ov[id]; if(o) return {v:o.v, src:'override'}; if(p.lock==='local') return {v:null, src:'missing'}; return {v:p.value, src:'brand'}; }
const spoken = (p,v) => (v==null||v==='')?'I don\'t have that information. I\'ll ask the team to get back to you.': p.tpl?p.tpl(v):v;
const fmtVal = (p,v) => (v==null||v==='')?'—': p.kind==='number'?`${v} ${p.unit}`:String(v);
function polHealth(p){
  const out=[];
  if(p.lock!=='local'&&p.confirmed>60) out.push(`Brand value not confirmed in ${p.confirmed} days`);
  Object.entries(p.ov).forEach(([id,o])=>{ if(!inScope(id)) return; if(o.days>60) out.push(`${L[id].name}: override not confirmed in ${o.days} days`); if(o.conflict) out.push(`${L[id].name}: conflicts with brand policy`); });
  if(p.lock==='local') polLocs(p).filter(l=>inScope(l.id)&&isLive(l.id)&&!p.ov[l.id]).forEach(l=>out.push(`${l.name}: no answer on file`));
  return out;
}

function launchStatus(id){ const x=D.launch[id]; if(x.live) return ['Live','good']; if(x.step===4) return ['Ready to go live','acc']; if(x.step===0) return ['Invited','']; return ['In progress','warn']; }
function pgLocations(){
  const t=S.role==='gx'?[['list','Location list']]:[['list','Location list'],['launch','Launch status']];
  if(S.role==='gx') S.ltab='list';
  return `${head('Locations', esc(scopeName()))}${tabs(t,S.ltab,'ltab')}${S.ltab==='launch'?locLaunch():locList()}`;
}
function locList(){
  const locs=scopeLocs(), k=S.sort.k, d=S.sort.d;
  const val=(l,key)=>key==='name'?l.name: key==='open'?D.fus.filter(f=>f.loc===l.id&&isOpen(f)).length: key==='od'?D.fus.filter(f=>f.loc===l.id&&isOverdue(f)).length: isLive(l.id)?l.m[key]:-1;
  const rows=[...locs].sort((a,b)=>{ const x=val(a,k), y=val(b,k); return (x>y?1:x<y?-1:0)*d; });
  const live=locs.filter(l=>isLive(l.id)), lowA=[...live].sort((a,b)=>a.m.answer-b.m.answer)[Math.floor(live.length*.2)], low=lowA?lowA.m.answer:0;
  const th=(key,label,n)=>`<th class="${n?'n':''}"><button data-a="sort" data-v="${key}">${label}${k===key?(d>0?' ↑':' ↓'):''}</button></th>`;
  return `<div class="tw"><table class="t"><thead><tr>${th('name','Location')}${th('calls','Calls 7d',1)}${th('answer','Answered',1)}${th('ai','Resolved by AI',1)}${th('failX','Failed xfer',1)}${th('open','Open FU',1)}${th('od','Overdue',1)}${th('rev','Revenue',1)}</tr></thead><tbody>
    ${rows.map(l=>{ const lv=isLive(l.id), od=val(l,'od'); return `<tr class="click" data-a="loc" data-v="${l.id}" tabindex="0"><td><b>${esc(l.name)}</b><div class="sub">${BRANDS[l.brand].name} · ${REGIONS[l.region].name}</div></td>${lv?`<td class="n">${l.m.calls}</td><td class="n ${l.m.answer<=low&&live.length>3?'worst':''}">${pct(l.m.answer)}</td><td class="n">${pct(l.m.ai)}</td><td class="n ${l.m.failX>4?'worst':''}">${l.m.failX}</td>`:`<td colspan="4">${chip('Launching · '+D.launch[l.id].step+' of 4','warn')}</td>`}<td class="n">${val(l,'open')}</td><td class="n ${od?'worst':''}">${od}</td><td class="n">${lv?money(l.m.rev):'—'}</td></tr>`; }).join('')}</tbody></table></div>
    ${note('Gap 1: a <b>working</b> cross-location view, not a report. Sort, spot the outlier, click through to the location page and its tabs.')}`;
}

    const linked=(it.linked||[]).map(id=>D.menu.find(x=>x.id===id));
    return {title:`Mark ${esc(it.name)} sold out`, body:`${locPicker(m,it.brand)}<div class="field"><span>For how long?</span><div class="pills">${[['close','Until close'],['manual','Until I change it'],['time','Until a time']].map(([v,t])=>`<button class="${m.dur===v?'on':''}" data-a="mset" data-v="dur|${v}">${t}</button>`).join('')}</div>
      ${m.dur==='time'?`<select class="input" id="m-time" data-c="modal.time" style="margin-top:6px;width:auto" aria-label="Until">${[1260,1290,1320,1350].map(t=>`<option value="${t}" ${Number(m.time)===t?'selected':''}>${clock(t)}</option>`).join('')}</select>`:''}</div>
      ${linked.length?`<label class="toggle"><input type="checkbox" id="m-linked" data-c="modal.linked" ${m.linked?'checked':''}> <span>Also affects: <b>${linked.map(x=>esc(x.name)).join(', ')}</b></span></label>`:''}
      ${hears(`Sorry, the ${it.name.toLowerCase()} is sold out tonight.${it.alt?` Can I suggest ${it.alt}?`:''}`,'If a caller asks')}
      ${errBanner(m,`Hostline is still offering ${esc(it.name)}. Check your connection and try again.`)}`,
      foot:`<button class="btn" data-a="unpick">Back</button>${saveBtn(m,'Mark sold out','savesold')}`};
  },
  pause(m){ return {title:'Pause orders', body:`${locPicker(m)}<div class="field"><span>Which orders?</span><div class="pills">${['Pickup','Delivery','All'].map(v=>`<button class="${m.what===v?'on':''}" data-a="mset" data-v="what|${v}">${v}</button>`).join('')}</div></div>
    <div class="field"><span>For how long?</span><div class="pills">${[['15','15 min'],['30','30 min'],['60','1 hour'],['0','Until I resume']].map(([v,t])=>`<button class="${m.mins===v?'on':''}" data-a="mset" data-v="mins|${v}">${t}</button>`).join('')}</div></div>
    ${hears(`Our kitchen is very busy right now, so we've paused ${m.what==='All'?'':m.what.toLowerCase()+' '}orders${m.mins!=='0'?` for about ${m.mins} minutes`:''}. I can book you a table instead.`,'Callers hear')}
    ${errBanner(m,'Orders are still open. Try again.')}`, foot:cancelBtn+saveBtn(m,`Pause ${m.what.toLowerCase()} orders`,'savepause')}; },
  closeearly(m){ return {title:'Close early tonight', body:`${locPicker(m)}<div class="field"><span>Close at</span><div class="pills">${[1230,1260,1290,1320].map(t=>`<button class="${m.at===t?'on':''}" data-a="mset" data-v="at|${t}">${clock(t)}</button>`).join('')}</div></div>
    <div class="field"><span>Reason (shared with HQ)</span><div class="pills">${['Kitchen slammed','Short-staffed','Weather','Private event'].map(v=>`<button class="${m.reason===v?'on':''}" data-a="mset" data-v="reason|${v}">${v}</button>`).join('')}</div></div>
    <div class="banner warn"><div class="grow small"><b>${m.at<=1260?4:2} reservations after ${clock(m.at)}.</b> Hostline won't cancel them. It stops taking new ones and texts you the list.</div></div>
    ${hears(`We're closing early tonight at ${clock(m.at)}. Can I book you a table for another evening?`,'Callers hear')}
    ${errBanner(m,'Hostline still gives the regular closing time. Try again.')}`, foot:cancelBtn+saveBtn(m,'Close at '+clock(m.at),'savecloseearly')}; },
  resolve(m){ const f=D.fus.find(x=>x.id===m.fu), opts=[...RESOLVE[f.type],'No answer, try again later'];
    return {title:`Resolve ${f.id}`, body:`<p class="small muted">${esc(f.type)} · ${esc(f.guest.name)} · <span class="mono">${esc(f.guest.phone)}</span></p>
      <div class="choice">${opts.map(o=>`<label class="${m.outcome===o?'on':''}"><input type="radio" name="res" data-c="modal.outcome" value="${esc(o)}" ${m.outcome===o?'checked':''}><span>${esc(o)}${o.startsWith('No answer')?`<small>Attempt ${f.attempts+1} of 2. ${f.attempts>=1?'This closes it as "Guest unreachable".':'It stays open with a reminder in 1 hour.'}</small>`:''}</span></label>`).join('')}</div>
      ${m.outcome==='Answer added to Knowledge'?`<label class="field"><span>Answer for ${esc(L[f.loc].name)}</span><textarea class="input" id="m-answer" data-i="modal.answer">${esc(m.answer)}</textarea></label>${hears(m.answer||'…','Next caller hears')}`:
        `<label class="field"><span>Note (optional)</span><textarea class="input" id="m-note" data-i="modal.note" placeholder="${f.type==='Event lead'?'e.g. Booked private dining room, set menu B':'What happened?'}">${esc(m.note||'')}</textarea></label>`}`,
      foot:cancelBtn+`<button class="btn pri" data-a="saveresolve" ${m.outcome?'':'disabled'}>${m.outcome&&m.outcome.startsWith('No answer')?'Log attempt':'Resolve'}</button>`}; },
  reassign(m){ const f=D.fus.find(x=>x.id===m.fu);
    const opts=[[L[f.loc].gm,'General Manager'],['Lena Park','Events Manager'],['Priya Shah','Guest Experience'],[REGIONS[L[f.loc].region].rm,'Regional Manager']].filter(o=>o[0]!==f.owner);
    return {title:`Reassign ${f.id}`, body:`<div class="choice">${opts.map(([n,r])=>`<label class="${m.to===n+'|'+r?'on':''}"><input type="radio" name="reas" data-c="modal.to" value="${esc(n)}|${esc(r)}" ${m.to===n+'|'+r?'checked':''}><span><b>${esc(n)}</b><small>${esc(r)}</small></span></label>`).join('')}</div>
      <p class="small muted">The new owner gets an SMS. The due time stays ${f.due<0?'overdue':'at '+clock(NOW+f.due)}.</p>`,
      foot:cancelBtn+`<button class="btn pri" data-a="savereassign" ${m.to?'':'disabled'}>Reassign</button>`}; },
  closefu(m){ const f=D.fus.find(x=>x.id===m.fu);
    return {title:`Close ${f.id} without action`, body:`<div class="choice">${['Duplicate of another follow-up','Spam or wrong number','Handled outside Hostline','Not needed'].map(o=>`<label class="${m.reason===o?'on':''}"><input type="radio" name="cl" data-c="modal.reason" value="${o}" ${m.reason===o?'checked':''}><span>${o}</span></label>`).join('')}</div>
      <label class="field"><span>Note (optional)</span><textarea class="input" id="m-note" data-i="modal.note">${esc(m.note||'')}</textarea></label>
      <p class="small muted">Closed without action counts separately in reports, so it can't hide unresolved guests.</p>`,
      foot:cancelBtn+`<button class="btn pri" data-a="saveclosefu" ${m.reason?'':'disabled'}>Close follow-up</button>`}; },
  impact(m){
    const p=D.policies.find(x=>x.id===m.pol), locs=polLocs(p), ovIds=Object.keys(p.ov), names=ovIds.map(id=>L[id].name);
    const nv=p.kind==='number'?Number(S.polDraft.v):S.polDraft.v, forced=m.lock==='locked';
    const conflict=p.rule&&p.kind==='number'&&nv!==p.rule.n&&!m.ruleFixed, ready=!conflict||m.ack;
    return {wide:true, title:`Review impact: ${esc(p.name)}`, body:`
      ${m.version?`<div class="banner bad"><div class="grow small"><b>Someone else changed this policy.</b> Renee Walsh (HQ) changed the brand value 3 minutes ago (8 → 9 guests). Load their version, then apply yours.</div><button class="btn sm" data-a="reloadpol">Load latest</button></div>`:''}
      <div class="grid2"><div class="field"><span>Change</span><p>${esc(fmtVal(p,p.value))} → <b>${esc(fmtVal(p,nv))}</b></p></div>
        <label class="field"><span>Lock state</span><select class="input" id="m-lock" data-c="modal.lock">${[['editable','Editable locally'],['locked','Locked by HQ']].map(([v,t])=>`<option value="${v}" ${m.lock===v?'selected':''}>${t}</option>`).join('')}</select></label></div>
      <div class="banner info"><div class="grow"><b>Applies to ${locs.length} locations.</b> ${ovIds.length?`${ovIds.length} override this: ${esc(names.join(', '))}.`:'No local overrides.'}</div></div>
      ${forced&&ovIds.length?`<div class="banner warn"><div class="grow small">Locking removes ${ovIds.length} overrides. ${esc(ovIds.map(id=>L[id].gm).join(', '))} will be notified.</div></div>`:''}
      ${ovIds.length&&!forced?`<div class="choice">${[['keep','Keep overrides',`${names.join(', ')} keep their own value.`],['reset','Reset all','Every location uses the new brand value.'],['per','Decide per location','Keep or reset each override.']].map(([v,t,s])=>`<label class="${m.choice===v?'on':''}"><input type="radio" name="pc" data-c="modal.choice" value="${v}" ${m.choice===v?'checked':''}><span><b>${t}</b><small>${esc(s)}</small></span></label>`).join('')}</div>
        ${m.choice==='per'?`<div class="list">${ovIds.map(id=>`<div class="li"><div class="grow"><b>${esc(L[id].name)}</b><p>Override: ${esc(fmtVal(p,p.ov[id].v))}</p></div><div class="pills"><button class="${m.per[id]!=='reset'?'on':''}" data-a="perloc" data-v="${id}|keep">Keep</button><button class="${m.per[id]==='reset'?'on':''}" data-a="perloc" data-v="${id}|reset">Reset</button></div></div>`).join('')}</div>`:''}`:''}
      ${hears(spoken(p,nv),'Callers will hear')}
      ${conflict?`<div class="banner bad"><div class="grow small"><b>Conflicts with a routing rule:</b> "${esc(p.rule.text)}". Callers with ${p.rule.n}–${Math.max(p.rule.n,nv-1)} guests would be transferred before hearing the new policy.
        <label class="toggle" style="margin-top:6px"><input type="checkbox" id="m-ack" data-c="modal.ack" ${m.ack?'checked':''}> Keep the rule, I understand the conflict</label></div><button class="btn sm" data-a="fixrule">Change rule to ${esc(nv)}+</button></div>`:''}
      ${m.ruleFixed?`<div class="banner good"><div class="grow small">The routing rule changes to parties of ${esc(nv)}+ when you apply.</div></div>`:''}
      ${note('Flow 1: apply everywhere <b>without silently breaking local exceptions</b>. Turn on "Simulate failed saves" to see the version conflict.')}`,
      foot:cancelBtn+`<button class="btn pri" data-a="applypol" ${ready?'':'disabled'}>Apply to ${locs.length} locations</button>`};
  },
  request(m){ const p=D.policies.find(x=>x.id===m.pol);
    return {title:'Request change', body:`<p class="small muted">HQ Ops decides on changes to brand policies. You'll get an answer by email and in notifications.</p>
      <div class="field"><span>Policy</span><p><b>${esc(p.name)}</b> · ${esc(fmtVal(p,p.value))}</p></div>
      <label class="field"><span>What should change, and why?</span><textarea class="input" id="m-reason" data-i="modal.reason" placeholder="e.g. Our room seats 12, so parties of 10 are fine here">${esc(m.reason||'')}</textarea></label>`,
      foot:cancelBtn+`<button class="btn pri" data-a="sendrequest" data-v="${esc(p.name)}" ${m.reason?'':'disabled'}>Send request</button>`}; },
  hours(m){ const l=L[m.loc], times=[]; for(let t=300;t<=1500;t+=30) times.push(t);
    const sel=(i,f)=>`<select class="input" style="width:auto;padding:4px 6px" id="h-${i}-${f}" data-c="h|${i}|${f}" aria-label="${m.h[i].day} ${f}">${times.map(t=>`<option value="${t}" ${t===m.h[i][f]?'selected':''}>${clock(t)}${t>=1440?' +1':''}</option>`).join('')}</select>`;
    const gaps=m.h.filter(d=>d.close-d.kitchen>=45), bad=m.h.some(d=>d.kitchen>d.close);
    return {wide:true, title:`Edit hours · ${esc(l.name)}`, body:`<div class="tw"><table class="t"><thead><tr><th>Day</th><th>Opens</th><th>Closes</th><th>Kitchen closes</th></tr></thead><tbody>${m.h.map((d,i)=>`<tr><td><b>${d.day}</b></td><td>${sel(i,'open')}</td><td>${sel(i,'close')}</td><td>${sel(i,'kitchen')}</td></tr>`).join('')}</tbody></table></div>
      ${gaps.length?`<div class="banner warn"><div class="grow small"><b>Split hours on ${gaps.map(g=>g.day).join(', ')}:</b> the kitchen closes before the restaurant. Callers hear that the kitchen is closed but the bar is open.</div></div>`:''}
      ${bad?'<div class="banner bad"><div class="grow small">The kitchen can\'t close after the restaurant does.</div></div>':''}
      ${hears(`We're open Friday from ${clock(m.h[4].open)} to ${clock(m.h[4].close)}. The kitchen takes last orders at ${clock(m.h[4].kitchen)}.`,'Preview (Friday)')}
      ${errBanner(m,'Callers still hear the old hours. Try again.')}`, foot:cancelBtn+saveBtn(m,'Save · live on next call','savehours',bad)}; },
  export(m){
    if(m.csv) return {wide:true, title:'Export ready', body:`<p class="small muted">${m.csv.split('\n').length-1} rows · ${esc(m.file)}</p><textarea class="input mono" id="m-csv" readonly style="min-height:200px;font-size:12px" aria-label="CSV">${esc(m.csv)}</textarea>`,
      foot:`<button class="btn" data-a="copycsv">Copy</button><button class="btn pri" data-a="dlcsv">Download CSV</button>`};
    const secs=['Calls and outcomes','AI resolution rate','Revenue from calls','Follow-up performance','Location comparison','Unanswered questions'];
    return {title:'Export CSV', body:`<p class="small">${esc(scopeName())} · ${PERIOD[S.rep.period][0]}</p>
      <div class="field"><span>Include</span>${secs.map((s,i)=>`<label class="toggle"><input type="checkbox" id="ex-${i}" data-c="exsec|${i}" ${m.secs[i]?'checked':''}> ${s}</label>`).join('')}</div>
      <label class="field"><span>Rows</span><select class="input" id="ex-rows" data-c="modal.rows"><option value="loc" ${m.rows==='loc'?'selected':''}>One row per location</option><option value="week" ${m.rows==='week'?'selected':''}>One row per location per week</option></select></label>`,
      foot:cancelBtn+`<button class="btn pri" data-a="makecsv" ${m.secs.some(Boolean)?'':'disabled'}>Export</button>`};
  },
  invite(m){ const valid=/.+@.+\..+/.test(m.email||'');
    return {title:'Invite member', body:`<label class="field"><span>Work email</span><input class="input" id="m-email" data-i="modal.email" type="email" value="${esc(m.email||'')}" placeholder="name@harborhearth.com">${m.email&&!valid?'<span class="err">Enter a full email address.</span>':''}</label>
      <label class="field"><span>Role</span><select class="input" id="m-role" data-c="modal.role">${ROLE_NAMES.map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select></label>
      ${m.role==='General Manager'?`<label class="field"><span>Location</span><select class="input" id="m-sloc" data-c="modal.sloc">${LOCS.map(l=>`<option ${m.sloc===l.name?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>`:''}
      ${m.role==='Regional Manager'?`<label class="field"><span>Region</span><select class="input" id="m-sreg" data-c="modal.sreg">${Object.values(REGIONS).map(r=>`<option ${m.sreg===r.name?'selected':''}>${r.name}</option>`).join('')}</select></label>`:''}
      <p class="small muted">They get an email with a link to create their account. The link expires in 7 days.</p>`,
      foot:cancelBtn+`<button class="btn pri" data-a="sendinvite" ${valid?'':'disabled'}>Send invite</button>`}; },
  role(m){ const t=D.team[m.i]; return {title:`Change role · ${esc(t.name)}`, body:`<div class="choice">${ROLE_NAMES.map(r=>`<label class="${m.role===r?'on':''}"><input type="radio" name="rl" data-c="modal.role" value="${r}" ${m.role===r?'checked':''}><span>${r}</span></label>`).join('')}</div><p class="small muted">Their access changes the next time they load a page.</p>`,
    foot:cancelBtn+`<button class="btn pri" data-a="saverole" ${m.role===t.role?'disabled':''}>Change role</button>`}; },
  remove(m){ const t=D.team[m.i], owned=D.fus.filter(f=>f.owner===t.name&&isOpen(f)).length, gl=LOCS.find(l=>l.gm===t.name);
    return {title:`Remove ${esc(t.name)}?`, body:`<p>${esc(t.name)} loses access to Hostline right away.</p>${owned?`<div class="banner warn"><div class="grow small">${plural(owned,'open follow-up')} move to ${esc(REGIONS[(gl||L.pier21).region].rm)} (Regional Manager).</div></div>`:''}`,
      foot:cancelBtn+'<button class="btn danger pri" data-a="saveremove">Remove member</button>'}; },
  phone(m){ const l=L[m.loc], digits=(m.num||'').replace(/\D/g,''), loop=!!digits&&LOCS.some(x=>x.line.replace(/\D/g,'')===digits);
    return {title:`Transfer line · ${esc(l.name)}`, body:`<label class="field"><span>Manager transfer number</span><input class="input mono" id="m-num" data-i="modal.num" value="${esc(m.num||'')}"><small>Hostline transfers here when a caller needs a person.</small></label>
      ${loop?`<div class="banner bad"><div class="grow small"><b>This would create a loop.</b> ${esc(m.num)} is a Hostline line, so transferred calls come straight back to Hostline. Use the manager's direct or mobile number.</div></div>`:''}
      <button class="btn sm back" data-a="testline" ${loop||!digits?'disabled':''}>Place a test transfer</button>${m.tested?'<div class="banner good"><div class="grow small">Test transfer answered after 2 rings.</div></div>':''}
      ${errBanner(m,'The old number is still in use. Try again.')}`, foot:cancelBtn+saveBtn(m,'Save','savephone',loop||!digits)}; },
  golive(m){ const l=L.pier21; return {title:'Go live at Pier 21?', body:`<p>From now on Hostline answers every call to <b class="mono">${l.main}</b>, forwarded to <span class="mono">${l.line}</span>.</p>
      <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Hours, menu and local answers are confirmed</li><li>Transfers go to <span class="mono">${esc(D.phones.pier21.transfer)}</span></li><li>Follow-ups come to you by SMS at <span class="mono">${esc(S.onb.phone||'(617) 555-0190')}</span></li></ul>
      <label class="toggle"><input type="checkbox" id="m-fwd" data-c="modal.fwd" ${m.fwd?'checked':''}> Call forwarding is set up on our main line</label>
      ${errBanner(m,'Pier 21 isn\'t live yet. Calls still ring the restaurant. Try again.')}`, foot:`<button class="btn" data-a="mclose">Not yet</button>${saveBtn(m,'Go live','savegolive',!m.fwd)}`}; }
};

/* =========================================================
   ONBOARDING & ACCESS
   ========================================================= */
function renderScreen(){
  const o=S.onb, r=ROLES[o.role];
  if(S.screen==='invite') return `<div class="auth"><div class="label">Invite email</div><div class="mail"><div class="mail-head"><span class="muted">From</span><span>Hostline &lt;no-reply@hostline.ai&gt;</span><span class="muted">To</span><span>${esc(r.email)}</span><span class="muted">Subject</span><b>${esc(r.inviter.split(' (')[0])} invited you to Hostline</b></div>
    <div class="mail-body"><div class="logo" style="padding:0"><i>H</i>Hostline</div><h2>Join Harbor &amp; Hearth Group on Hostline</h2>
      <p>${esc(r.inviter)} added you as <b>${o.role==='gm'?'General Manager of Pier 21':'HQ Ops Admin'}</b>.</p>
      <p class="small muted">${o.role==='gm'?'Hostline will answer Pier 21\'s phone. Before it goes live, you confirm your hours, menu and a few local answers. It takes about 10 minutes.':'Hostline answers restaurant calls for all 18 locations. You\'ll see rollout status, performance and follow-ups across the group.'}</p>
      <div><button class="btn pri" data-a="scr" data-v="signup">Accept invite</button></div><p class="small muted">This link expires in 7 days.</p></div></div>
    ${note('IA: Onboarding &amp; access → <b>Invite email</b> → Create account → Welcome by role. Use "Start from" to switch between the HQ and GM paths.')}</div>`;
  if(S.screen==='signup'){ const pwOk=o.pw.length>=10, match=o.pw&&o.pw===o.pw2;
    return `<div class="auth"><div class="authcard"><div class="logo" style="padding:0"><i>H</i>Hostline</div><h1>Create your account</h1>
      <label class="field"><span>Full name</span><input class="input" id="su-name" data-i="onb.name" value="${esc(o.name)}" autocomplete="name"></label>
      <label class="field"><span>Work email</span><input class="input" value="${esc(r.email)}" readonly><small>From your invite</small></label>
      <label class="field"><span>Password</span><input class="input" type="password" id="su-pw" data-i="onb.pw" value="${esc(o.pw)}" autocomplete="new-password"><small style="${o.pw&&!pwOk?'color:var(--bad)':''}">At least 10 characters</small></label>
      <label class="field"><span>Confirm password</span><input class="input" type="password" id="su-pw2" data-i="onb.pw2" value="${esc(o.pw2)}" autocomplete="new-password">${o.pw2&&!match?'<span class="err">Passwords don\'t match.</span>':''}</label>
      ${o.role==='gm'?`<label class="field"><span>Mobile for alerts</span><input class="input mono" id="su-phone" data-i="onb.phone" value="${esc(o.phone)}" placeholder="(617) 555-0000" autocomplete="tel"><small>New and overdue follow-ups come by SMS. You can change this later.</small></label>`:''}
      <button class="btn pri full" data-a="createaccount" ${o.name&&pwOk&&match?'':'disabled'}>Create account</button>
      <p class="small muted">Already have an account? <button class="btn ghost sm" data-a="scr" data-v="login">Log in</button></p></div></div>`; }
  if(S.screen==='welcome'){
    const first=(o.name||r.person).split(' ')[0];
    if(o.role==='hq') return `<div class="auth"><div class="authcard wide"><div class="label">Welcome</div><h1>Welcome, ${esc(first)}</h1>
        <p>Harbor &amp; Hearth Group has <b>${LOCS.filter(l=>isLive(l.id)).length} of 18 locations</b> live on Hostline. The rest are still launching.</p>
        <div class="kpis">${['Live','In progress','Invited'].map(s=>`<div class="kpi"><div class="label">${s}</div><div class="v">${LOCS.filter(l=>launchStatus(l.id)[0]===s).length}</div></div>`).join('')}</div>
        <div class="row"><button class="btn pri" data-a="enter" data-v="launch">See rollout status</button><button class="btn" data-a="enter" data-v="overview">Go to Overview</button></div>
        ${note('Welcome by role: HQ lands on <b>rollout status</b>, GMs on their <b>launch checklist</b>.')}</div></div>`;
    return `<div class="auth"><div class="authcard wide"><div class="label">Welcome</div><h1>Welcome, ${esc(first)}. Let's get Pier 21 ready.</h1>
      <p>The Hostline team has set up your phone line and pulled your menu from Toast. You check that it's right.</p>
      <div class="list">${STEPS.map((s,i)=>`<div class="li"><span class="chip">${i+1}</span><div class="grow"><b>${s}</b><p>${['Opening and kitchen hours for each day','Items Hostline offers callers','Parking, large parties and other local questions','Hear Hostline answer a call before guests do'][i]}</p></div></div>`).join('')}</div>
      <p class="small muted">About 10 minutes. You can stop and continue later.</p>
      <div class="row"><button class="btn pri" data-a="checklist">Start launch checklist</button><button class="btn" data-a="enter" data-v="overview">Later</button></div></div></div>`;
  }
  if(S.screen==='checklist') return renderChecklist();
  if(S.screen==='login') return `<div class="auth"><div class="authcard"><div class="logo" style="padding:0"><i>H</i>Hostline</div><h1>Log in</h1>
      <label class="field"><span>Work email</span><input class="input" type="email" id="li-email" data-i="auth.email" value="${esc(S.auth.email)}" autocomplete="username"></label>
      <label class="field"><span>Password</span><input class="input" type="password" id="li-pw" data-i="auth.pw" value="${esc(S.auth.pw)}" autocomplete="current-password"></label>
      ${S.auth.err?`<div class="banner bad"><div class="grow small">${esc(S.auth.err)}</div></div>`:''}
      <button class="btn pri full" data-a="login">Log in</button><button class="btn ghost sm back" data-a="scr" data-v="reset">Forgot password?</button>
      <p class="small muted">Prototype: you'll sign in as ${esc(me().person)} (${esc(me().label)}). Change this with "View as".</p></div></div>`;

function renderChecklist(){

    next='Menu looks right';
  } else if(i===3){ const A=o.answers; valid=!!A.parking.trim();

      ${hears(A.parking||'I don\'t have that information. I\'ll ask the team to get back to you.','Callers hear')}
      <div class="field"><span>Large parties</span><p class="small">Brand answer: parties of <b>8 or more</b> book with the events team. ${chip('Editable locally')}</p>
        <label class="toggle small"><input type="checkbox" id="ob-lp" data-c="oblp" ${A.lpOverride?'checked':''}> Use a different number at Pier 21</label>
        ${A.lpOverride?`<input class="input" type="number" min="2" id="ob-lpv" data-i="onb.answers.lp" value="${esc(A.lp)}" style="width:120px" aria-label="Large party threshold">`:''}</div>
      <label class="field"><span>Anything else callers often ask? (optional)</span><textarea class="input" id="ob-extra" data-i="onb.answers.extra" placeholder="e.g. We have a heated patio from October to April">${esc(A.extra)}</textarea></label>`;
    next='Save answers';
  } else {
    const A=o.answers, lp=A.lpOverride?Number(A.lp):8;
    const tx=[['AI',greet(l)],['Caller','Hi, what time does the kitchen close tonight?'],['AI',`The kitchen takes last orders at ${clock(o.hours[4].kitchen)} tonight.`],['Caller','And where do I park?'],['AI',A.parking||'I don\'t have that information. I\'ll ask the team to get back to you.'],['Caller','Can I book for ten people on Saturday?'],['AI',10>=lp?`For parties of ${lp} or more, our events team takes the booking. I can take your details.`:'Of course. What time on Saturday?'],['Caller','Do you have the grilled salmon?'],['AI',o.menuOff.m1?'Sorry, the grilled salmon isn\'t available. Can I suggest the fish & chips?':'Yes, the grilled salmon is on the menu tonight.']];
    valid=o.testOk;
    body=`<h1>Test call</h1><p class="muted">Hear how Hostline answers Pier 21 before guests do. Call <b class="mono">${l.line}</b> from your phone, or play a sample here.</p>
      ${!o.test?'<div><button class="btn pri" data-a="obtest">Play test call</button></div>':`${player('test')}<div class="box">${transcript(tx)}</div>

  return `<div class="auth"><div class="authcard wide">

    ${i===4?note('Popup: <b>Confirm go live</b>. The GM confirms call forwarding, so nothing goes live by accident.'):''}</div></div>`;
}

  savephone(){ const m=S.modal; if(S.fail){ m.err=true; return; } const p=D.phones[m.loc], prev={...p}; p.transfer=m.num; if(p.status==='transfer') p.status='ok'; S.modal=null; toast(`Transfer line for ${L[m.loc].name} updated.`, ()=>Object.assign(p,prev)); },
  profilesave(){ D.prefs=S.profileDraft.prefs; S.profileDraft=null; toast('Profile and notification settings saved.'); },
  profilex(){ S.profileDraft=null; },
  pwreset(){ toast(`We sent a password reset link to ${me().email}.`); },
  scr(v){ S.screen=v; S.auth.err=null; scrollTop(); },
  createaccount(){ S.screen='welcome'; scrollTop(); },
  enter(v){ enterApp(); if(v==='launch'){ goPage('locations'); S.ltab='launch'; } else goPage('overview'); },
  checklist(){ const o=S.onb; S.screen='checklist'; o.step=Math.min(4,D.launch.pier21.step+1); o.hours=o.hours||JSON.parse(JSON.stringify(D.hours.pier21)); o.menuOff=o.menuOff||{}; o.answers=o.answers||{parking:'', lpOverride:false, lp:10, extra:''}; scrollTop(); },
  obnext(){ const o=S.onb, lx=D.launch.pier21;
    if(o.step===1) D.hours.pier21=JSON.parse(JSON.stringify(o.hours));
    if(o.step===2) D.menu.filter(m=>m.brand==='hk').forEach(it=>{ const k='pier21:'+it.id; if(o.menuOff[it.id]) D.avail[k]={until:'manual', by:me().person, at:NOW}; else if(D.avail[k]&&!D.avail[k].pos) delete D.avail[k]; });
    if(o.step===3){ D.policies.find(x=>x.id==='P3').ov.pier21={v:o.answers.parking, by:me().person, days:0}; const lp=D.policies.find(x=>x.id==='P1'); if(o.answers.lpOverride) lp.ov.pier21={v:Number(o.answers.lp), by:me().person, days:0}; else delete lp.ov.pier21; }
    lx.step=Math.max(lx.step,o.step); lx.cur=STEPS[o.step]||'Go live'; lx.last='Today '+clock(NOW); o.step++; scrollTop(); },
  obback(){ S.onb.step--; scrollTop(); },
  obexit(){ enterApp(); goPage('overview'); toast('Progress saved. Continue any time from Overview.'); },
  obtest(){ S.onb.test=true; S.playing='test'; },
  savegolive(){ const m=S.modal; if(S.fail){ m.err=true; return; } const lx=D.launch.pier21; Object.assign(lx,{live:true, step:4, since:'Sep 25, 2026', last:'Today '+clock(NOW)}); D.phones.pier21.status='ok';
    addLog('Launch: went live', 'Pier 21', 'Launching', 'Live'); S.modal=null; S.playing=null; enterApp(); goPage('overview'); toast('Pier 21 is live. Hostline is answering your calls.'); },
  login(){ const a=S.auth; if(!a.email||!a.pw){ a.err='Enter your email and password.'; return; } if(S.fail){ a.err='That email and password don\'t match. Try again or reset your password.'; return; } enterApp(); goPage('overview'); },
  sendreset(){ if(!/.+@.+\..+/.test(S.auth.email)){ S.auth.err='Enter your full work email.'; return; } S.screen='resetSent'; }
};

/* ---------- change & input ---------- */
function setPath(path,val){ const ks=path.split('.'); let o=S; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]; if(o==null) return; } o[ks[ks.length-1]]=val; }
const C={
  role(v){ S.role=v; S.scope=defaultScope(v); S.drawer=null; S.modal=null; S.menu=null; S.polDraft=null; S.local=null; S.locId=null; S.polId=null; S.fu.sel=null; S.profileDraft=null; S.rep.loc='all'; if(S.page==='locations'&&v==='gm') S.page='overview'; },
  start(v){ S.modal=null; S.drawer=null; S.menu=null; S.toast=null;
    if(v==='app'){ enterApp(); return; }
    if(v==='login'){ S.screen='login'; S.auth={email:me().email, pw:'', err:null}; return; }
    const r=v.slice(7); C.role(r);
    S.onb={role:r, step:1, name:ROLES[r].person, pw:'', pw2:'', phone:'', test:false, testOk:false, answers:null, hours:null, menuOff:null};
    if(r==='gm'){ D.launch.pier21={step:0, live:false, since:'—', last:'Invited today', cur:'Create account'}; delete D.policies.find(x=>x.id==='P3').ov.pier21; }
    S.screen='invite'; },
  frame(v,el){ S.frame=el.checked; },
  fail(v,el){ S.fail=el.checked; },
  notes(v,el){ S.notes=el.checked; },
  hoursLoc(v){ S.hoursLoc=v; },
  'modal.linked'(v,el){ S.modal.linked=el.checked; },
  'modal.ack'(v,el){ S.modal.ack=el.checked; },
  'modal.fwd'(v,el){ S.modal.fwd=el.checked; },
  oblp(v,el){ S.onb.answers.lpOverride=el.checked; },
  obok(v,el){ S.onb.testOk=el.checked; },
  quiet(v,el){ S.profileDraft=profileData(); S.profileDraft.quiet=el.checked; }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){ if(S.menu&&!e.target.closest('.menu')){ S.menu=null; render(); } return; }
  if(el.disabled) return;
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault(); if(el.dataset.a!=='menu') S.menu=null;
  fn(el.dataset.v||'', el, e); render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.menu) S.menu=null; else if(S.modal) S.modal=null; else if(S.drawer) S.drawer=null; else return; render(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-a], .li[data-a], .item[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset.c; if(!k) return;
  const p=k.split('|');
  if(p[0]==='h') S.modal.h[Number(p[1])][p[2]]=Number(el.value);
  else if(p[0]==='obh') S.onb.hours[Number(p[1])][p[2]]=Number(el.value);
  else if(p[0]==='obmenu') S.onb.menuOff[p[1]]=!el.checked;
  else if(p[0]==='exsec') S.modal.secs[Number(p[1])]=el.checked;
  else if(p[0]==='pref'){ S.profileDraft=profileData(); S.profileDraft.prefs[p[1]][p[2]]=el.checked; }
  else if(C[k]) C[k](el.value, el);
  else setPath(k, el.value);
  render();
});
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset.i; if(!k) return;
  if(k.startsWith('profileDraft.')) S.profileDraft=profileData();
  setPath(k, el.value); render();
});
const _render=render;
render=function(){ _render(); if(wantTop){ wantTop=false; const el=document.querySelector('.vps'); if(el) el.scrollTop=0; } };

initData(); initState(); render();
})();
</script>
